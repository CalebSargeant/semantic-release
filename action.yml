name: 'Diatreme'
description: 'Semantic release orchestration for TBD/BBD pipelines with Docker image promotion and promotion PR automation.'

branding:
  icon: 'git-branch'
  color: 'purple'

# ─────────────────────────────────────────────────────────────────────────────
# INPUTS
# ─────────────────────────────────────────────────────────────────────────────
inputs:

  # ── Mode ─────────────────────────────────────────────────────────────────
  mode:
    description: |
      Pipeline mode. One of:
        ci                 Build Docker image and push pr-<N> to GHCR (run on pull_request events).
        release            (default) Run versioning, promote Docker image, and optionally create a promotion PR (when deployment-model is tbd-pr and create-promotion-pr is true).
        enable-auto-merge  Enable native GitHub auto-merge on the PR referenced by `pr-number`. Intended for non-promotion (feature) PRs invoked from a separate `pull_request` workflow. The repository must have "Allow auto-merge" enabled and branch protection with at least one required status check on the target branch — both are GitHub prerequisites for auto-merge, not Diatreme ones.
    required: false
    default: 'release'

  # ── Authentication mode ─────────────────────────────────────────────────
  auth-mode:
    description: |
      Token source for git/release operations. One of:
        public-app    (default) Use the Diatreme GitHub App installed on the repository or organization.
        auto          Use private-app when app-id/app-private-key are set, otherwise use github-token/GITHUB_TOKEN.
        github-token  Use github-token or the workflow GITHUB_TOKEN.
        private-app   Generate a token from app-id/app-private-key.
    required: false
    default: 'public-app'

  token-broker-url:
    description: |
      Advanced override for the hosted Diatreme GitHub App auth service.
      Most repositories should not set this.
    required: false
    default: 'https://api.diatreme.magmamoose.com'

  oidc-audience:
    description: 'Advanced override for public-app authentication. Most repositories should not set this.'
    required: false
    default: 'diatreme'

  # ── Versioning tool ──────────────────────────────────────────────────────
  versioning-tool:
    description: |
      The versioning tool to use. One of:
        auto                      (default) Detect the tool from repository
                                  markers under `working-directory`. See the
                                  detection rules below.
        semantic-release-python   python-semantic-release v10
        semantic-release-npm      semantic-release v24 (Node.js / JavaScript)
        gitversion                GitVersion via gittools/actions
        release-please            Google release-please-action v4

      Autodetection (versioning-tool: auto) inspects `working-directory` in
      two tiers and errors if nothing matches or the signals conflict — set an
      explicit tool to opt out.

      Tier 1 — a tool's own release config (authoritative, one tool each):
        semantic-release-python   pyproject.toml with a [tool.semantic_release] table
        semantic-release-npm      .releaserc* / release.config.*
        gitversion                GitVersion.yml|.yaml (or gitversion-config)
        release-please            release-please-config.json /
                                  .release-please-manifest.json (or
                                  release-please-config-file)
      Two or more distinct tier-1 tools is a conflict → error.

      Tier 2 — ecosystem manifests (only when no tier-1 config is found):
        semantic-release-python   pyproject.toml / setup.py / setup.cfg
        semantic-release-npm      package.json
        gitversion                *.csproj / *.sln
      When several tier-2 manifests coexist, a fixed precedence
      (python → npm → gitversion) breaks the tie so a Python service that also
      carries a package.json still resolves to python.
    required: false
    default: 'auto'

  # ── Deployment model ─────────────────────────────────────────────────────
  deployment-model:
    description: |
      Controls how the target environment is determined. One of:
        tbd       (default) Trunk-Based Development. Pass `environment` explicitly.
        bbd       Branch-Based Development. Environment inferred from branch-map.
        tbd-pr    TBD with PR-based promotion. Environment detected from the merged promote/* PR head branch.
    required: false
    default: 'tbd'

  branch-map:
    description: |
      JSON object mapping branch names to environment names. Only used when
      deployment-model is bbd.

      Plain BBD (one branch per environment):
        {"dev": "dev", "staging": "staging", "main": "prod"}

      Strict GitFlow (release/* and hotfix/* are dynamic branch families).
      Keys containing `*` are treated as globs — they match any segment up
      to the next slash boundary the same way shell globs do, anchored at
      both ends:
        {"develop": "dev", "release/*": "staging", "hotfix/*": "prod", "main": "prod"}

      Exact matches always win over globs. When two globs both match, the
      one with the longer key wins, so a specific pattern like
      `release/hotfix/*` beats `release/*`.

      `master` and `main` are interchangeable for exact-match lookup —
      a branch-map entry for `"main"` will match a `master`-default repo
      and vice versa, so the same map works across repos that haven't
      finished renaming. An explicit entry for either always wins over
      the implicit alias.
    required: false
    default: ''

  promote-branch-prefix:
    description: |
      Prefix for promotion PR branches (deployment-model: tbd-pr).
      Example: 'promote' → branch promote/staging/1.2.3-dev.1
    required: false
    default: 'promote'

  promote-target-branch:
    description: 'Target branch for promotion PRs.'
    required: false
    default: 'main'

  create-promotion-pr:
    description: |
      When true, automatically creates the next environment promotion PR after a
      prerelease (deployment-model: tbd-pr only). Set to false when using a
      separate promotion workflow or manual process.

      One open promotion PR per target environment: if an open promotion PR
      already exists for the next environment (any version), its title and
      body are refreshed to the latest tag instead of opening a duplicate.
      Reviewers should click "Update Branch" on the existing PR before
      merging so the cut reflects the latest commits on the target branch —
      the version in the PR title is metadata; the cut version is derived
      from the merged commit history.
    required: false
    default: 'false'

  # ── Environment model ────────────────────────────────────────────────────
  environment:
    description: |
      The target environment for this run. Must be in `environments`.
      Required when deployment-model is tbd.
    required: false
    default: ''

  environments:
    description: |
      JSON array of environment names in promotion order.
      The last entry is always treated as production (stable semver).
      Profiles: ["dev","prod"] | ["dev","staging","prod"] | ["dev","tst","acc","prd"]
    required: false
    default: '["dev", "staging", "prod"]'

  prerelease-identifiers:
    description: |
      JSON object mapping environment names to prerelease identifier strings.
      The production environment must be omitted from this map.
      Example: {"dev": "dev", "staging": "rc"}
    required: false
    default: '{"dev": "dev", "staging": "rc"}'

  tag-prefix:
    description: 'Version tag prefix.'
    required: false
    default: 'v'

  # ── Authentication ────────────────────────────────────────────────────────
  github-token:
    description: |
      GitHub token for GHCR login and, unless auth-mode uses a GitHub App, git
      push, tag creation, GitHub Releases, and promotion PR creation. Defaults
      to the workflow GITHUB_TOKEN when omitted.
    required: false
    default: ''

  app-id:
    description: |
      GitHub App ID. When provided with app-private-key, generates a short-lived
      token to bypass branch protection rules.
    required: false
    default: ''

  app-private-key:
    description: 'GitHub App private key (PEM). Required when app-id is set.'
    required: false
    default: ''

  submodules:
    description: |
      Pass-through to actions/checkout's `submodules` input on
      diatreme's internal checkout step.

      When set non-false in `auth-mode: private-app` or `auth-mode:
      auto` with App credentials, the App installation token is also
      broadened from the current-repo scope to the owner scope so
      submodules from sibling repositories in the same org can be
      fetched. The App must be installed on the submodule's repo for
      that broadened scope to actually grant access.

      For `auth-mode: github-token` / `public-app`, the configured
      token must have read access to the submodule repository — the
      action does not generate a separate token in those modes.

      One of:
        false      (default) Skip submodules.
        true       Fetch submodules at the recorded SHA, one level deep.
        recursive  Fetch submodules and nested submodules.
    required: false
    default: 'false'

  # ── Docker ────────────────────────────────────────────────────────────────
  image_name:
    description: |
      Base image name without registry or owner prefix (e.g., my-app).
      Sets IMAGE_NAME=<owner>/<image_name> for the bake file.

      Optional — when omitted, Diatreme auto-detects it from the Docker Bake
      config (`bake_file` / `bake_target`): it runs `docker buildx bake
      --print`, takes the first non-empty target tag, and strips the digest,
      tag, registry, and owner/org prefix down to the base name. An explicit
      value always wins over detection.

      Detection drives the same image workflows an explicit value does — the
      CI image build (mode: ci), the image scan (image-scan), and release
      image promotion (mode: release). So mode: ci and BBD release promotion
      work without passing image_name as long as the bake file has tagged
      targets. With no bake file present and no explicit value, image_name is
      left empty and image workflows are skipped (versioning-only runs are
      unaffected). A bake file that exists but yields no tags is a hard error —
      Diatreme never falls back to the repository name.

      To keep a tagged bake file but run versioning only, set
      `detect-image-name: false` to opt out of detection entirely.
    required: false
    default: ''

  bake_file:
    description: 'Path to docker-bake.hcl'
    required: false
    default: 'docker-bake.hcl'

  bake_target:
    description: |
      Bake target or group to build/promote.
      Groups are expanded — all sub-targets are built/promoted automatically.
    required: false
    default: 'default'

  detect-image-name:
    description: |
      When true (default) and `image_name` is empty, auto-detect the base image
      name from the Docker Bake config (see `image_name`). Set to false to opt
      out of detection: `image_name` then behaves as it did before this feature
      — an empty value leaves image workflows off.

      This is the escape hatch for a repo that keeps a tagged `docker-bake.hcl`
      but runs Diatreme for versioning only (no image build/promotion) and so
      does not want a bare `mode: ci`/`release` run to start building or
      promoting images. An explicit `image_name` always wins regardless of this
      flag.
    required: false
    default: 'true'

  registry:
    description: 'Container registry'
    required: false
    default: 'ghcr.io'

  registry-username:
    description: |
      Username for `docker login` against `registry`. Defaults to
      `github.actor` when blank, which is what GHCR on github.com expects.

      Override when targeting a registry that requires fixed credentials —
      e.g. GitHub Enterprise Server's container registry
      (`containers.<ghes-host>`), Harbor, JFrog Artifactory, Nexus, Azure
      Container Registry. Pass a workflow secret, typically
      `secrets.REGISTRY_USERNAME`.

      When set, you should also set `registry-password`. The pair is used
      verbatim for both CI image pushes (`pr-<N>` tags) and release image
      promotion.
    required: false
    default: ''

  registry-password:
    description: |
      Password / token for `docker login` against `registry`. Defaults to
      the workflow's `GITHUB_TOKEN` (the `github-token` input, or
      `github.token` when that is blank), which is what GHCR on github.com
      expects. This is independent of the token used for git operations —
      git ops use the GitHub App installation token under `auth-mode:
      private-app` or `public-app`, but registry login always falls back
      to the workflow token.

      Override when targeting a registry that requires fixed credentials.
      Pass a workflow secret, typically `secrets.REGISTRY_PASSWORD`. When
      set, you should also set `registry-username`. The pair is used
      verbatim for both CI image pushes and release image promotion.
    required: false
    default: ''

  platforms:
    description: 'Target platforms (comma-separated) for CI builds and fallback fresh builds.'
    required: false
    default: 'linux/amd64'

  build-github-token:
    description: |
      Optional token passed as --secret id=github_token to docker buildx bake.
      Use when Dockerfiles use --mount=type=secret,id=github_token to pull
      private packages (e.g. GitHub Packages).
      Pass secrets.NPM_TOKEN or secrets.GITHUB_TOKEN from the calling workflow.
    required: false
    default: ''

  # ── Image scanning & SBOM (mode: ci) ──────────────────────────────────────
  # Scan the assembled pr-<N> image and route results to their sinks: a
  # CycloneDX SBOM to Dependency-Track (component CVEs), and optional findings
  # to DefectDojo (OS CVEs, misconfigurations, secrets in layers). Reporting is
  # visibility-first — a successful scan never blocks the PR unless
  # `image-scan-gate` is on. A scanner that cannot run is a build error.
  image-scan:
    description: |
      Scan the assembled pr-<N> image after build (mode: ci) and emit its
      SBOM + findings. Off by default. Requires `image_name`.
    required: false
    default: 'false'

  image-scan-severity:
    description: |
      Trivy `--severity` filter for findings and the optional gate
      (comma-separated). The CycloneDX SBOM still inventories all components.
    required: false
    default: 'CRITICAL,HIGH'

  image-scan-scanners:
    description: |
      Trivy `--scanners` to run for the findings report. Default covers OS/lib
      CVEs, secrets baked into layers, and image misconfigurations.
    required: false
    default: 'vuln,secret,misconfig'

  image-scan-gate:
    description: |
      Block the build when findings at/above `image-scan-severity` exist.
      Default false (non-blocking, visibility only) — start here and tighten
      later. This is a blunt severity threshold; net-new diffing against the
      base image is the intended direction.
    required: false
    default: 'false'

  image-scan-strict:
    description: |
      Treat a *sink* failure (Dependency-Track / DefectDojo unreachable or
      rejecting) as fatal instead of a non-blocking warning. Default false —
      reporting backends stay failure-isolated, so an outage never fails the PR.
    required: false
    default: 'false'

  dependency-track-url:
    description: |
      Dependency-Track base URL (e.g. https://dtrack.example.com). When set,
      the image's CycloneDX SBOM is uploaded as the assembled-image project —
      distinct from any source-dependency SBOM project for the same repo.
      Empty disables the sink. Outages are non-blocking.
    required: false
    default: ''

  dependency-track-api-key:
    description: 'Dependency-Track API key with BOM upload permission. Pass a workflow secret.'
    required: false
    default: ''

  dependency-track-project-name:
    description: |
      Dependency-Track project name. Defaults to the image repository path
      (e.g. owner/app). With multiple bake targets, the image leaf name is
      appended to keep the projects distinct.
    required: false
    default: ''

  dependency-track-project-version:
    description: 'Dependency-Track project version. Defaults to the image tag (e.g. pr-12).'
    required: false
    default: ''

  dependency-track-auto-create:
    description: |
      Create the Dependency-Track project/version on first upload. Default true
      (the API key then needs PROJECT_CREATION_UPLOAD in addition to BOM_UPLOAD).
    required: false
    default: 'true'

  defectdojo-url:
    description: |
      DefectDojo base URL (e.g. https://dd.example.com). When set, the Trivy
      findings report is imported. Empty disables the sink. Outages are
      non-blocking. Optional — the SBOM → Dependency-Track feed already yields
      component CVEs; this adds OS CVEs / misconfigs / secrets.
    required: false
    default: ''

  defectdojo-api-key:
    description: 'DefectDojo API v2 token. Pass a workflow secret.'
    required: false
    default: ''

  defectdojo-engagement:
    description: |
      DefectDojo engagement id to import into. If empty, set
      `defectdojo-product-name` to import via auto-created context instead.
      If both are empty while `defectdojo-url` is set, the import is skipped
      with a warning (non-blocking).
    required: false
    default: ''

  defectdojo-product-name:
    description: |
      DefectDojo product name for the auto-create-context import path (used
      when `defectdojo-engagement` is empty).
    required: false
    default: ''

  defectdojo-product-type:
    description: 'DefectDojo product type for the auto-create-context path (optional).'
    required: false
    default: ''

  defectdojo-engagement-name:
    description: 'DefectDojo engagement name for the auto-create-context path. Default "Diatreme image scan".'
    required: false
    default: ''

  defectdojo-close-old:
    description: |
      Close findings that are no longer present, on reimport. Default true.
      Diatreme imports via DefectDojo's reimport-scan so one Test per engagement
      is updated across PR re-runs (mirrors Chargate).
    required: false
    default: 'true'

  # ── Package publishing ────────────────────────────────────────────────────
  # Native library-package publishing, in addition to (or instead of) Docker
  # image promotion. Opt-in via `publish-package: true`; gated on the same
  # `released` signal and environment logic as versioning/tagging, so each run
  # publishes the version diatreme just computed for its environment —
  # prereleases on dev/staging, stable on prod (the prerelease state is
  # encoded in the version string itself, e.g. 1.2.3-rc.1).
  publish-package:
    description: |
      When true, pack and push a language package to `package-feed-url` after
      versioning, using the version diatreme computed (the `version` output).
      Off by default so existing image-promotion / versioning-only consumers
      are unaffected. Runs only when a new version was released
      (`released == true`), after Docker image promotion and before the
      GitHub Release is published — so a `release:published` listener finds
      the package already in the feed (same ordering rationale as images).
    required: false
    default: 'false'

  package-ecosystem:
    description: |
      Package ecosystem to publish when `publish-package` is true. One of:
        nuget     .NET — `dotnet pack` + `dotnet nuget push`.
        npm       Node.js — `npm publish`.
        maven     JVM — `mvn versions:set` + `mvn deploy`.
        gradle    JVM — `gradle publish` (project's maven-publish block).
        rubygems  Ruby — `gem build` + `gem push`.
        container OCI image — `docker build` + `docker push` (ghcr.io).
        pip       Python — `python -m build` + `twine upload` (PyPI / any
                  index; not a GitHub Packages ecosystem, kept for convenience).
      All but pip are GitHub Packages ecosystems and default to this repo's
      GitHub Packages feed. Required when `publish-package` is true.
    required: false
    default: ''

  package-path:
    description: |
      Project or path to pack/build/publish. Defaults to `working-directory`.
        nuget     A .csproj/.sln/.nupkg path or a directory.
        npm       The package directory (or a package.json path).
        maven     The project dir or its pom.xml.
        gradle    The project dir (or a build.gradle(.kts) path).
        rubygems  The dir containing the .gemspec.
        container The Docker build context (must contain a Dockerfile).
        pip       The source dir containing pyproject.toml/setup.py.
    required: false
    default: ''

  package-feed-url:
    description: |
      Upload / publish endpoint. Accepts a public GitHub Packages host, a
      canonical public registry (npmjs / nuget.org / rubygems.org / Maven
      Central / PyPI) for public distribution, or a GitHub Enterprise host —
      Enterprise Server `<ecosystem>.HOSTNAME` or data-residency
      `<ecosystem>.SUBDOMAIN.ghe.com`. The auth model is unchanged; only the
      host differs. Empty defaults per-ecosystem (the repo's GitHub Packages
      feed, except npm/pip which default to the public registry):
        nuget     NuGet v3 index. Default https://nuget.pkg.github.com/<owner>/index.json.
        npm       npm registry. Default https://registry.npmjs.org (public).
        maven     Maven repo URL. Default https://maven.pkg.github.com/<owner>/<repo>.
        gradle    Informational only — the repository is defined in build.gradle.
        rubygems  Gem host. Default https://rubygems.pkg.github.com/<owner>.
        container Image registry host. Default ghcr.io; set this to publish to
                  another registry, e.g. an enterprise containers.HOSTNAME.
        pip       twine repository URL (--repository-url). Empty publishes to PyPI.
      Note: the GitHub Packages Apache Maven registry is not available on
      data-residency (*.ghe.com) tenants — use your enterprise Maven host there.
    required: false
    default: ''

  package-token:
    description: |
      Auth token / API key for the package feed. Defaults to the workflow
      GITHUB_TOKEN (the `github-token` input, or `github.token`), which is
      what GitHub Packages feeds expect with `packages: write`. This is the
      registry-login token, independent of the git/release auth token — pass
      a workflow secret (e.g. secrets.NUGET_FEED_TOKEN) when targeting a feed
      that requires fixed credentials, such as a GitHub Enterprise Packages
      feed on another host.
    required: false
    default: ''

  package-username:
    description: |
      Feed / registry-login username. Defaults to `__token__` for `pip` (twine)
      and `x-access-token` for `maven`/`gradle`/`rubygems`/`container`. Ignored
      by `nuget` and `npm`, which authenticate with the token alone.
    required: false
    default: ''

  dotnet-version:
    description: |
      .NET SDK version range for `package-ecosystem: nuget`, passed to
      actions/setup-dotnet. Override to match the project's target framework
      (e.g. 9.0.x). Multiple versions can be newline-separated.
    required: false
    default: '8.0.x'

  python-version:
    description: |
      Python version for `package-ecosystem: pip`, passed to
      actions/setup-python.
    required: false
    default: '3.x'

  node-version:
    description: |
      Node.js version for `package-ecosystem: npm`, passed to
      actions/setup-node.
    required: false
    default: '20'

  java-version:
    description: |
      Java (JDK) version for `package-ecosystem: maven` / `gradle`, passed to
      actions/setup-java.
    required: false
    default: '17'

  java-distribution:
    description: |
      JDK distribution for `package-ecosystem: maven` / `gradle`, passed to
      actions/setup-java (e.g. temurin, zulu, corretto).
    required: false
    default: 'temurin'

  ruby-version:
    description: |
      Ruby version for `package-ecosystem: rubygems`, passed to ruby/setup-ruby.
    required: false
    default: '3.3'

  package-name:
    description: |
      Image name for `package-ecosystem: container`, published as
      `<package-feed-url|ghcr.io>/<package-name>:<version>`. Defaults to the
      repository (owner/repo) lowercased. Ignored by the other ecosystems,
      which take their name from the project manifest.
    required: false
    default: ''

  npm-provenance:
    description: |
      When true, publish npm packages with build provenance
      (`npm publish --provenance`). Valid only for the public npm registry
      (registry.npmjs.org) — the run fails if package-feed-url points elsewhere,
      since GitHub Packages and other registries don't accept npmjs provenance
      attestations. Requires `id-token: write` on the job (the default
      `auth-mode: public-app` already grants it) and a public `repository`
      field in package.json matching the publishing repo. Ignored unless
      package-ecosystem is npm.
    required: false
    default: 'false'

  pypi-trusted-publishing:
    description: |
      When true, authenticate pip/twine uploads via GitHub OIDC (PyPI Trusted
      Publishing) instead of package-token — no stored token. Valid only for
      public PyPI / TestPyPI; the run fails for any other index (private indexes
      keep using package-token). Requires `id-token: write` on the job (the
      default `auth-mode: public-app` already grants it) and a Trusted Publisher
      configured for this repo+workflow on the PyPI project. Ignored unless
      package-ecosystem is pip.
    required: false
    default: 'false'

  # ── CI-specific ──────────────────────────────────────────────────────────
  enforce_branch_naming:
    description: |
      Enforce TBD branch naming convention on PRs (mode: ci).
      Allowed prefixes: feat, fix, chore, hotfix, docs, refactor, perf, test,
      ci, style, build, revert, deploy, release (plus the promote prefix). Add
      more via extra-branch-prefixes.
      Set to false for BBD (branches are named after environments).
    required: false
    default: 'true'

  extra-branch-prefixes:
    description: |
      Additional branch-name prefixes to accept beyond the built-in set
      (mode: ci, enforce_branch_naming: true). Comma-, space-, or
      pipe-separated. Example: 'spike wip' accepts spike/* and wip/* branches.

      Each prefix must be letters, digits, '_' or '-' (a trailing '/' is
      allowed and ignored). Anything else is rejected: the prefixes are
      matched as a regex, where a metacharacter would silently widen or
      break the check rather than add a prefix.
    required: false
    default: ''

  # ── Integrations: GitHub Projects ─────────────────────────────────────────
  aggregate-github-projects:
    description: |
      When true, after a release is created, walk the commits in the release
      range and the bodies of any PRs landed in that range, collect issue
      and PR references (#NNN), look up their Projects v2 membership via
      the GitHub GraphQL API, and append a "## GitHub Project items"
      section (grouped by Project, with the item's Status when available)
      to the GitHub Release notes and to any open promotion PR body that
      mentions the tag.

      The auth token must have:
        - Repository: Contents: Read
        - Repository: Issues: Read
        - Repository: Pull requests: Read
        - Repository: Releases: Write (to edit release notes)
        - Repository: Pull requests: Write (to edit promotion PR bodies)
        - Organization or User: Projects: Read

      With auth-mode: public-app, the default Diatreme App ships
      with only the permissions needed for tagging and Releases. Issues,
      Pull requests, and Projects must be granted on the App settings
      AND re-accepted on each installation; otherwise the GraphQL probe
      that finds a ref's Projects v2 membership returns NOT_FOUND for
      every issue/PR (the script logs "Ref #N: GraphQL returned no
      node" with the underlying error and skips the ref).

      With auth-mode: github-token, the workflow GITHUB_TOKEN cannot
      read org-scoped Projects v2 — supply a PAT with `repo` and
      `read:project` (or fine-grained equivalents).
    required: false
    default: 'false'

  move-github-projects-on-release:
    description: |
      When true, after a release is created, move every Projects v2 item
      linked to issues/PRs in the release range to a target Status.
      Intended for closing the loop on releases — e.g. moving "In review"
      cards to "Released" when the prod tag is cut.

      Set `github-projects-target-status` to the Status value to move to
      (must already exist on the Project). The status move is opt-in
      because not every project board has a "Released" column.

      Skipped silently when the project's Status field has no matching
      option. Works alongside `aggregate-github-projects` — the two are
      independent toggles, and they need the same Issues + PRs + Projects
      read scopes (see aggregate-github-projects). For the move itself
      the token must additionally have Organization or User: Projects:
      Write. With auth-mode: github-token, supply a PAT with `project`
      scope (read+write).
    required: false
    default: 'false'

  github-projects-target-status:
    description: |
      Target Status name for `move-github-projects-on-release`. Must match
      an existing single-select option on each project's Status field.
      Common values: 'Released', 'Done', 'Shipped'.
    required: false
    default: 'Released'

  github-projects-move-on-environments:
    description: |
      JSON array of environments where the auto-move should fire. Defaults
      to the production environment only (last entry of `environments`),
      so prereleases don't prematurely mark items released.

      Special values:
        '@last'   (default) Resolve at runtime to the last entry of
                  `environments`. Production-by-default in any naming.
        '[]'      Move on every environment.

      Or a literal JSON array of environment names, e.g. '["staging","prod"]'.
    required: false
    default: '@last'

  # ── Guardrails ────────────────────────────────────────────────────────────
  admin-required-from:
    description: |
      Threshold environment for the manual-release guardrail. Manual
      workflow_dispatch runs whose target environment is at or after this
      threshold (in the `environments` list) require the actor to have
      `permission: admin` on the repository. Push and promotion-PR-merge
      triggers are unaffected.

      Special values:
        '@last'   (default) Use the last entry in `environments`. With the
                  default environments=["dev","staging","prod"] this protects
                  prod only; with environments=["dev","tst","acc","prd"] it
                  protects prd only. The point is to give every consumer
                  production protection out of the box without needing to
                  know the literal env name.
        ''        Opt out. No manual-release guardrail.

      Or set to a specific environment name (must appear in `environments`)
      to gate that env and everything downstream.

      Examples (environments = ["dev","staging","prod"]):
        '@last'   → only prod releases require admin (default)
        prod      → only prod releases require admin
        staging   → staging and prod require admin
        dev       → all envs require admin
        ''        → no guardrail

      The auth token must allow Repository: Administration: Read. With
      auth-mode: public-app, grant the permission on the Diatreme App
      and accept it on the installation.
    required: false
    default: '@last'

  # ── Common release options ────────────────────────────────────────────────
  working-directory:
    description: |
      Working directory containing the versioning config file.
      For semantic-release-python: pyproject.toml
      For semantic-release-npm:    .releaserc.json / package.json
      For gitversion:              GitVersion.yml
    required: false
    default: '.'

  create-release:
    description: 'Create a GitHub Release on every version bump.'
    required: false
    default: 'true'

  changelog:
    description: 'Generate/update CHANGELOG.md (semantic-release-python and semantic-release-npm).'
    required: false
    default: 'true'

  force-bump:
    description: |
      Force a specific version bump instead of letting the versioning tool
      decide from commit messages. Designed for `workflow_dispatch` runs
      where there are no qualifying conventional commits since the last
      release but you still want to cut a new version (the typical
      "no_release / Released: false" outcome).

      Allowed values:
        patch    Force a patch bump (e.g. 1.2.3 → 1.2.4).
        minor    Force a minor bump (e.g. 1.2.3 → 1.3.0).
        major    Force a major bump (e.g. 1.2.3 → 2.0.0).
        ''       (default) Let the versioning tool decide.

      Honoured by:
        - semantic-release-python: passed as the upstream `force` input.
        - gitversion: passed to gittools/actions@v4 as
          `overrideConfig: increment=Major|Minor|Patch`.

      Ignored by semantic-release-npm and release-please — those tools
      have no clean equivalent and a forced bump would conflict with the
      tool's own logic. Wire your `workflow_dispatch` `bump` input to
      this input from the caller workflow.
    required: false
    default: ''

  version-override:
    description: |
      Explicit version to release/build. Accepts SemVer with optional `v`
      prefix, e.g. `3.20.0` or `v3.20.0-rc.1`.

      When set, diatreme skips automatic version calculation and uses
      this value for release tag/image versioning. The optional `v` prefix is
      stripped only for `${VERSION}` substitution in bake/build args.

      Mutually exclusive with `force-bump`.
    required: false
    default: ''

  # ── Version file injection (any tool) ─────────────────────────────────────
  version-file:
    description: |
      Path to a JSON or YAML file where the released version is injected and
      committed back to the branch after every release. Works with every
      versioning tool, not just GitVersion. Typical uses:
      - JSON: persist the version into `appsettings.json` for a .NET app.
      - YAML: update `appVersion` in a Helm `Chart.yaml` so the chart tracks
        the released image tag automatically.

      File format is detected from the extension: `.yaml`/`.yml` files are
      processed with `yq`; all other files are processed with `jq`.

      The commit uses the resolved release auth token (Diatreme App,
      private app, or `github-token`), so it can bypass branch-protection
      rulesets when the App is in the bypass list. The commit message ends
      with `[skip ci]` so the push does not retrigger the release workflow.

      Leave empty to disable. The file must exist or the step is skipped
      with a warning.
    required: false
    default: ''

  version-file-json-path:
    description: |
      jq path for the version field inside `version-file` when the file is
      JSON. Only used when `version-file` is set and the file is not a
      `.yaml`/`.yml` file. Example: `.Application.Version`
    required: false
    default: '.Application.Version'

  version-file-yaml-path:
    description: |
      yq path for the version field inside `version-file` when the file is
      YAML (`.yaml` or `.yml` extension). Only used when `version-file` is
      set and the file has a YAML extension. Example: `.appVersion`

      For Helm charts, set this to `.appVersion` (default) to update the
      application version, or `.version` to update the chart version, or a
      custom path for other YAML schemas.
    required: false
    default: '.appVersion'
  # ── Integrations ──────────────────────────────────────────────────────────
  aggregate-clickup-tickets:
    description: |
      When true, after a release is created scan the commits in the release
      range and the descriptions of PRs that landed in that range for ClickUp
      ticket URLs (https://app.clickup.com/t/...). Any matches are appended
      as a "## ClickUp tickets" section to the GitHub Release notes and to
      the auto-opened promotion PR body when one exists.

      The auth token must allow editing release notes and PR bodies. With
      auth-mode: public-app this is already covered by the Diatreme App.
    required: false
    default: 'false'

  # ── GitVersion-specific ───────────────────────────────────────────────────
  gitversion-spec:
    description: 'GitVersion version spec (e.g., 6.x). Only used when versioning-tool is gitversion.'
    required: false
    default: '6.x'

  gitversion-config:
    description: |
      Path to a GitVersion config file. Only used when the resolved versioning
      tool is gitversion.

      Empty (the default) means Diatreme looks for a `GitVersion.yml` or
      `GitVersion.yaml` under `working-directory` and hands that to GitVersion,
      or lets GitVersion run on its built-in defaults when neither exists. Set
      this only to point at a config kept somewhere else — an explicit path
      that does not exist is an error.

      A relative path is resolved against `working-directory`, matching how
      autodetection scopes its markers. An absolute path is used as-is.
    required: false
    default: ''

  gitversion-appsettings-file:
    description: |
      DEPRECATED — use `version-file` instead. Retained for backwards
      compatibility. When both are set, `version-file` wins.
    required: false
    default: ''

  gitversion-appsettings-version-path:
    description: |
      DEPRECATED — use `version-file-json-path` instead. Retained for
      backwards compatibility.
    required: false
    default: ''

  # ── release-please-specific ───────────────────────────────────────────────
  release-please-release-type:
    description: 'release-please release type (python, node, simple, go, etc.).'
    required: false
    default: 'simple'

  release-please-config-file:
    description: 'Path to release-please-config.json.'
    required: false
    default: 'release-please-config.json'

  # ── enable-auto-merge mode ────────────────────────────────────────────────
  pr-number:
    description: |
      Pull request number to operate on. Required for `mode: enable-auto-merge`.
      Typically passed as `github.event.pull_request.number` from a
      `pull_request` workflow (wrapped in the usual expression syntax in
      the caller's `with:` block).
    required: false
    default: ''

  auto-merge-method:
    description: |
      Merge method used by `mode: enable-auto-merge`. One of:
        squash  (default) Squash the PR's commits into a single commit on the target branch.
        merge   Standard merge commit.
        rebase  Rebase the PR's commits onto the target branch.
    required: false
    default: 'squash'

# ─────────────────────────────────────────────────────────────────────────────
# OUTPUTS
# ─────────────────────────────────────────────────────────────────────────────
outputs:
  version:
    description: 'Semver version string without prefix (e.g., 1.2.3 or 1.2.3-rc.1)'
    value: ${{ steps.normalize.outputs.version }}
  tag:
    description: 'Full git tag with prefix (e.g., v1.2.3 or v1.2.3-rc.1)'
    value: ${{ steps.normalize.outputs.tag }}
  is-prerelease:
    description: '"true" if this environment produces a prerelease version'
    value: ${{ steps.detect-env.outputs.is_prerelease }}
  released:
    description: '"true" if a new version was created and published'
    value: ${{ steps.normalize.outputs.released }}
  prerelease-identifier:
    description: 'The prerelease identifier (e.g., dev, rc, alpha). Empty for production.'
    value: ${{ steps.detect-env.outputs.prerelease_identifier }}
  resolved-environment:
    description: 'The resolved environment name.'
    value: ${{ steps.detect-env.outputs.environment }}
  package-published:
    description: '"true" if a language package was packed and pushed to the configured feed.'
    value: ${{ steps.publish-package.outputs.published }}
  image-scanned:
    description: '"true" if the assembled pr-<N> image(s) were scanned (mode: ci with image-scan).'
    value: ${{ steps.scan-image.outputs.scanned }}
  image-findings:
    description: 'Count of image-scan findings at/above image-scan-severity across all scanned images.'
    value: ${{ steps.scan-image.outputs.image-findings }}
  resolved-image-name:
    description: |
      The base image name Diatreme used for image workflows — the explicit
      `image_name` input when set, otherwise the value auto-detected from the
      Docker Bake config. Empty when neither applies (versioning-only runs).
    value: ${{ steps.resolve-image.outputs.image_name }}

# ─────────────────────────────────────────────────────────────────────────────
# STEPS
# ─────────────────────────────────────────────────────────────────────────────
runs:
  using: composite
  steps:

    # ── 0. Resolve GH_HOST for the gh CLI ───────────────────────────────────
    # Every subsequent `gh release`, `gh api`, etc. call in this action
    # talks to the GitHub host this workflow is running on. The CLI
    # otherwise defaults to github.com, which silently misroutes API
    # calls (or 404s) when the action runs on a GHE Server instance.
    # Persist GH_HOST to $GITHUB_ENV so every later step inherits it.
    - name: Resolve GH_HOST for the gh CLI
      shell: bash
      run: |
        echo "GH_HOST=${GITHUB_SERVER_URL#https://}" >> "$GITHUB_ENV"

    # ── 1. Optional GitHub App token ────────────────────────────────────────
    - name: Generate private GitHub App token
      id: app-token
      if: |
        inputs.auth-mode == 'private-app' ||
        (
          inputs.auth-mode == 'auto' &&
          inputs.app-id != '' &&
          inputs.app-private-key != ''
        )
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        # When the caller requests submodule checkout, broaden the
        # installation token's scope from the current repo to all repos
        # in the owner that the App is installed on. Empty string =
        # default current-repo scope.
        owner: ${{ inputs.submodules != 'false' && github.repository_owner || '' }}

    - name: Request public GitHub App token
      id: public-app-token
      if: (inputs.mode == 'release' || inputs.mode == 'enable-auto-merge') && inputs.auth-mode == 'public-app'
      shell: bash
      env:
        TOKEN_BROKER_URL: ${{ inputs.token-broker-url }}
        OIDC_AUDIENCE: ${{ inputs.oidc-audience }}
      run: "${GITHUB_ACTION_PATH}/scripts/request-public-app-token.sh"

    - name: Resolve GitHub auth token
      id: auth
      shell: bash
      env:
        ACTION_MODE: ${{ inputs.mode }}
        AUTH_MODE: ${{ inputs.auth-mode }}
        PRIVATE_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        PUBLIC_APP_TOKEN: ${{ steps.public-app-token.outputs.token }}
        DEFAULT_GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
      run: "${GITHUB_ACTION_PATH}/scripts/resolve-auth-token.sh"

    # ── 2. Checkout ─────────────────────────────────────────────────────────
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        fetch-tags: true
        token: ${{ steps.auth.outputs.token }}
        submodules: ${{ inputs.submodules }}

    # ── 3. Resolve image name (ci + release) ─────────────────────────────────
    # image_name is optional. When the caller omits it, derive the base image
    # name from the repo's Docker Bake config — the same way the environment is
    # inferred from the deployment model — so no caller needs a bespoke
    # pre-step just to compute it. An explicit image_name always wins. Every
    # downstream image step (CI build, image scan, release promotion) gates on
    # and reads this resolved value, so detection and explicit input drive the
    # identical path. Runs after Checkout so the bake file is on disk.
    - name: Resolve image name
      id: resolve-image
      if: inputs.mode == 'ci' || inputs.mode == 'release'
      shell: bash
      env:
        INPUT_IMAGE_NAME: ${{ inputs.image_name }}
        DETECT_IMAGE_NAME: ${{ inputs.detect-image-name }}
        INPUT_BAKE_FILE: ${{ inputs.bake_file }}
        INPUT_BAKE_TARGET: ${{ inputs.bake_target }}
        # Inherited by `bake --print` so the printed target set matches the
        # build/promote steps (only matters if the bake file gates targets on
        # this secret).
        BAKE_GITHUB_TOKEN: ${{ inputs.build-github-token }}
      run: "${GITHUB_ACTION_PATH}/scripts/resolve-image-name.sh"

    # ═════════════════════════════════════════════════════════════════════════
    # CI MODE — build and push pr-<N> image
    # ═════════════════════════════════════════════════════════════════════════

    - name: Check TBD branch naming
      if: inputs.mode == 'ci' && inputs.enforce_branch_naming == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        PROMOTE_BRANCH_PREFIX: ${{ inputs.promote-branch-prefix }}
        EXTRA_BRANCH_PREFIXES: ${{ inputs.extra-branch-prefixes }}
      run: "${GITHUB_ACTION_PATH}/scripts/check-branch-naming.sh"

    - name: Validate version override
      id: version-override
      if: (inputs.mode == 'ci' || inputs.mode == 'release') && inputs.version-override != ''
      shell: bash
      env:
        INPUT_VERSION_OVERRIDE: ${{ inputs.version-override }}
        INPUT_FORCE_BUMP: ${{ inputs.force-bump }}
        INPUT_TAG_PREFIX: ${{ inputs.tag-prefix }}
      run: |
        set -euo pipefail
        RAW="${INPUT_VERSION_OVERRIDE}"

        if [ -n "${INPUT_FORCE_BUMP}" ]; then
          echo "::error::version-override and force-bump are mutually exclusive; set only one."
          exit 1
        fi

        # Reject build metadata (`+...`). Strict SemVer allows it, but the
        # resolved version is also used as a Docker tag downstream
        # (`NEW_TAG="${IMAGE}:${TAG}"`) and Docker tags forbid `+`. Failing
        # at validation gives the caller a clear error instead of an opaque
        # registry-side failure after the tag is already cut.
        if ! [[ "${RAW}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
          echo "::error::version-override '${RAW}' is not a Docker-compatible SemVer. Expected examples: 3.20.0, 3.20.0-rc.1, v3.20.0. Build metadata (e.g. '1.2.3+meta') is rejected because Docker tags forbid '+'."
          exit 1
        fi

        VERSION="${RAW#v}"
        TAG="${INPUT_TAG_PREFIX}${VERSION}"

        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"

    - name: Set up QEMU
      if: inputs.mode == 'ci' && steps.resolve-image.outputs.image_name != ''
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

    - name: Set up Docker Buildx (CI)
      if: inputs.mode == 'ci' && steps.resolve-image.outputs.image_name != ''
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    - name: Log in to container registry (CI)
      if: inputs.mode == 'ci' && steps.resolve-image.outputs.image_name != ''
      uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username || github.actor }}
        password: ${{ inputs.registry-password || steps.auth.outputs.registry-token }}

    - name: Build and push pr-<N>
      if: inputs.mode == 'ci' && steps.resolve-image.outputs.image_name != ''
      shell: bash
      env:
        VERSION: ${{ inputs.version-override != '' && steps.version-override.outputs.version || format('pr-{0}', github.event.pull_request.number) }}
        REGISTRY: ${{ inputs.registry }}
        PLATFORMS: ${{ inputs.platforms }}
        BAKE_GITHUB_TOKEN: ${{ inputs.build-github-token }}
        OWNER: ${{ github.repository_owner }}
        REF_NAME: ${{ github.ref_name }}
        INPUT_IMAGE_NAME: ${{ steps.resolve-image.outputs.image_name }}
        INPUT_BAKE_FILE: ${{ inputs.bake_file }}
        INPUT_BAKE_TARGET: ${{ inputs.bake_target }}
      run: |
        set -euo pipefail

        OWNER_LOWER=$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')
        export IMAGE_NAME="${OWNER_LOWER}/${INPUT_IMAGE_NAME}"

        echo "IMAGE_NAME: ${IMAGE_NAME}"
        echo "VERSION:    ${VERSION}"

        TARGETS=$(docker buildx bake \
          -f "${INPUT_BAKE_FILE}" "${INPUT_BAKE_TARGET}" \
          --print 2>/dev/null | jq -r '.target | keys[]')

        CACHE_ARGS=()
        for TARGET in ${TARGETS}; do
          SCOPE="bk-${TARGET}-${REF_NAME}"
          CACHE_ARGS+=(--set "${TARGET}.cache-from=type=gha,scope=${SCOPE}")
          CACHE_ARGS+=(--set "${TARGET}.cache-to=type=gha,mode=max,scope=${SCOPE}")
        done

        docker buildx bake \
          -f "${INPUT_BAKE_FILE}" \
          "${INPUT_BAKE_TARGET}" \
          "${CACHE_ARGS[@]}" \
          --push

    # ─────────────────────────────────────────────────────────────────────────
    # CI MODE — scan the assembled image, emit SBOM + findings
    # ─────────────────────────────────────────────────────────────────────────
    - name: Install Trivy
      if: inputs.mode == 'ci' && steps.resolve-image.outputs.image_name != '' && inputs.image-scan == 'true'
      uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      with:
        cache: true

    - name: Scan image and report
      id: scan-image
      if: inputs.mode == 'ci' && steps.resolve-image.outputs.image_name != '' && inputs.image-scan == 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version-override != '' && steps.version-override.outputs.version || format('pr-{0}', github.event.pull_request.number) }}
        OWNER: ${{ github.repository_owner }}
        INPUT_IMAGE_NAME: ${{ steps.resolve-image.outputs.image_name }}
        INPUT_REGISTRY: ${{ inputs.registry }}
        INPUT_PLATFORMS: ${{ inputs.platforms }}
        INPUT_BAKE_FILE: ${{ inputs.bake_file }}
        INPUT_BAKE_TARGET: ${{ inputs.bake_target }}
        # Same build secret the build step passed, so `bake --print` renders the
        # identical tag set here (matters only if a bake file gates targets on it).
        BAKE_GITHUB_TOKEN: ${{ inputs.build-github-token }}
        SCAN_SEVERITY: ${{ inputs.image-scan-severity }}
        SCANNERS: ${{ inputs.image-scan-scanners }}
        SCAN_GATE: ${{ inputs.image-scan-gate }}
        STRICT: ${{ inputs.image-scan-strict }}
        DEPENDENCY_TRACK_URL: ${{ inputs.dependency-track-url }}
        DEPENDENCY_TRACK_API_KEY: ${{ inputs.dependency-track-api-key }}
        DEPENDENCY_TRACK_PROJECT_NAME: ${{ inputs.dependency-track-project-name }}
        DEPENDENCY_TRACK_PROJECT_VERSION: ${{ inputs.dependency-track-project-version }}
        DEPENDENCY_TRACK_AUTO_CREATE: ${{ inputs.dependency-track-auto-create }}
        DEFECTDOJO_URL: ${{ inputs.defectdojo-url }}
        DEFECTDOJO_API_KEY: ${{ inputs.defectdojo-api-key }}
        DEFECTDOJO_ENGAGEMENT: ${{ inputs.defectdojo-engagement }}
        DEFECTDOJO_PRODUCT_NAME: ${{ inputs.defectdojo-product-name }}
        DEFECTDOJO_PRODUCT_TYPE: ${{ inputs.defectdojo-product-type }}
        DEFECTDOJO_ENGAGEMENT_NAME: ${{ inputs.defectdojo-engagement-name }}
        DEFECTDOJO_CLOSE_OLD: ${{ inputs.defectdojo-close-old }}
      run: |
        set -euo pipefail

        # Re-resolve the bake env exactly as the build step did so `bake --print`
        # renders the same tags that were just pushed.
        OWNER_LOWER=$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')
        export IMAGE_NAME="${OWNER_LOWER}/${INPUT_IMAGE_NAME}"
        export REGISTRY="${INPUT_REGISTRY}"
        export VERSION="${VERSION}"
        export PLATFORMS="${INPUT_PLATFORMS}"

        # One ref per bake target — the canonical tag (tags[0]), which carries
        # the pr-<N> version. This is the exact image that release promotes by
        # digest, so what we scan here is what ships.
        IMAGE_REFS=$(docker buildx bake -f "${INPUT_BAKE_FILE}" "${INPUT_BAKE_TARGET}" --print 2>/dev/null \
          | jq -r '.target[].tags[0] // empty' | sort -u)
        echo "Image refs to scan:"
        echo "${IMAGE_REFS}"

        IMAGE_REFS="${IMAGE_REFS}" "${GITHUB_ACTION_PATH}/scripts/scan-image.sh"

    # ═════════════════════════════════════════════════════════════════════════
    # RELEASE MODE — versioning
    # ═════════════════════════════════════════════════════════════════════════

    - name: Detect environment
      id: detect-env
      if: inputs.mode == 'release'
      shell: bash
      env:
        INPUT_DEPLOYMENT_MODEL: ${{ inputs.deployment-model }}
        INPUT_BRANCH_MAP: ${{ inputs.branch-map }}
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_ENVIRONMENTS: ${{ inputs.environments }}
        INPUT_PRERELEASE_IDENTIFIERS: ${{ inputs.prerelease-identifiers }}
        INPUT_PROMOTE_BRANCH_PREFIX: ${{ inputs.promote-branch-prefix }}
      run: |
        set -euo pipefail

        DEPLOY_MODEL="${INPUT_DEPLOYMENT_MODEL}"
        BRANCH_MAP="${INPUT_BRANCH_MAP}"
        ENV="${INPUT_ENVIRONMENT}"
        ENVS="${INPUT_ENVIRONMENTS}"
        IDS="${INPUT_PRERELEASE_IDENTIFIERS}"

        echo "Deployment model: ${DEPLOY_MODEL}"
        echo "Environments:     ${ENVS}"
        echo "Identifiers:      ${IDS}"

        if [ "${DEPLOY_MODEL}" == "bbd" ]; then
          if [ -z "${BRANCH_MAP}" ] || [ "${BRANCH_MAP}" == '{}' ] || [ "${BRANCH_MAP}" == 'null' ]; then
            echo "::error::deployment-model is 'bbd' but branch-map is empty."
            exit 1
          fi
          BRANCH="${GITHUB_REF_NAME}"

          # 1) Try exact match first — fastest and unambiguous. `master`
          # and `main` alias each other so a single branch-map works for
          # repos that have and haven't been renamed off `master`. The
          # alias is guarded by `has($b)`: an explicit entry for either
          # name (even one set to null) suppresses the alias and behaves
          # like the historical `.[$b] // empty` lookup. The alias only
          # kicks in when the branch key is absent from the map.
          DETECTED_ENV=$(echo "${BRANCH_MAP}" | jq -r --arg b "${BRANCH}" '
            if has($b) then (.[$b] // empty)
            else (if   $b == "main"   then (.["master"] // empty)
                  elif $b == "master" then (.["main"]   // empty)
                  else empty end)
            end
          ')

          # 2) Fall back to glob patterns. Keys containing `*` are treated as
          # globs (translated to anchored regex with dots escaped). This
          # lets strict GitFlow callers map dynamic branch families:
          #   {"develop":"dev","release/*":"staging","hotfix/*":"prod","main":"prod"}
          # We sort longest-key-first so a specific pattern like
          # `release/hotfix/*` beats `release/*` when both match.
          if [ -z "${DETECTED_ENV}" ]; then
            DETECTED_ENV=$(echo "${BRANCH_MAP}" | jq -r --arg b "${BRANCH}" '
              to_entries
              | map(select(.key | contains("*")))
              | sort_by(.key | length) | reverse
              | map(. as $e | select($b | test("^" + ($e.key | gsub("\\."; "\\\\.") | gsub("\\*"; "[^/]*")) + "$")))
              | (.[0].value // empty)
            ')
            if [ -n "${DETECTED_ENV}" ]; then
              echo "BBD: matched glob pattern in branch-map for '${BRANCH}'"
            fi
          fi

          if [ -z "${DETECTED_ENV}" ]; then
            echo "::error::Branch '${BRANCH}' has no mapping in branch-map: ${BRANCH_MAP}"
            exit 1
          fi
          ENV="${DETECTED_ENV}"
          echo "BBD: resolved environment '${ENV}' from branch '${BRANCH}'"
        fi

        if [ "${DEPLOY_MODEL}" == "tbd-pr" ]; then
          BRANCH_PREFIX="${INPUT_PROMOTE_BRANCH_PREFIX}"
          HEAD_REF="${GITHUB_HEAD_REF}"
          if [ -n "${HEAD_REF}" ] && echo "${HEAD_REF}" | grep -qE "^${BRANCH_PREFIX}/[^/]+/"; then
            DETECTED_ENV=$(echo "${HEAD_REF}" | cut -d'/' -f2)
            ENV="${DETECTED_ENV}"
            echo "TBD-PR: detected env '${ENV}' from PR branch '${HEAD_REF}'"
          elif [ -n "${ENV}" ]; then
            echo "TBD-PR: using explicitly provided environment '${ENV}'"
          else
            echo "::error::deployment-model is 'tbd-pr' but environment cannot be determined."
            exit 1
          fi
        fi

        if [ -z "${ENV}" ]; then
          echo "::error::'environment' is required when deployment-model is 'tbd'."
          exit 1
        fi

        echo "Environment: ${ENV}"

        if ! echo "${ENVS}" | jq -e --arg env "${ENV}" 'index($env) != null' > /dev/null; then
          echo "::error::Environment '${ENV}' is not in the environments array: ${ENVS}"
          exit 1
        fi

        PROD_ENV=$(echo "${ENVS}" | jq -r '.[-1]')

        if [ "${ENV}" == "${PROD_ENV}" ]; then
          echo "is_prerelease=false"    >> "$GITHUB_OUTPUT"
          echo "prerelease_identifier=" >> "$GITHUB_OUTPUT"
          echo "Stable release for '${ENV}'"
        else
          IDENTIFIER=$(echo "${IDS}" | jq -r --arg env "${ENV}" '.[$env] // "rc"')
          echo "is_prerelease=true"                  >> "$GITHUB_OUTPUT"
          echo "prerelease_identifier=${IDENTIFIER}" >> "$GITHUB_OUTPUT"
          echo "Prerelease '${IDENTIFIER}' for '${ENV}'"
        fi

        echo "environment=${ENV}" >> "$GITHUB_OUTPUT"

    # ── Manual-release guardrail (release mode only) ───────────────────────
    # Restrict manual workflow_dispatch runs to repo admins, scoped to a
    # threshold environment and everything downstream of it (later in
    # `environments`). The threshold defaults to `@last`, which resolves to
    # the production environment in any naming scheme — so production is
    # protected by default for both TBD and BBD callers.
    #
    # Push and promotion-PR-merge triggers are unaffected. The auth token
    # needs Repository: Administration: Read.
    - name: Repo admin guardrail (manual releases only)
      if: |
        inputs.mode == 'release' &&
        github.event_name == 'workflow_dispatch' &&
        inputs.admin-required-from != ''
      shell: bash
      env:
        GH_TOKEN: ${{ steps.auth.outputs.token }}
        OWNER: ${{ github.repository_owner }}
        REPO: ${{ github.event.repository.name }}
        ACTOR: ${{ github.actor }}
        RAW_THRESHOLD: ${{ inputs.admin-required-from }}
        CURRENT_ENV: ${{ steps.detect-env.outputs.environment }}
        ENVIRONMENTS: ${{ inputs.environments }}
      run: |
        set -euo pipefail

        # Resolve magic threshold values (currently only '@last').
        if [ "${RAW_THRESHOLD}" = "@last" ]; then
          THRESHOLD=$(echo "${ENVIRONMENTS}" | jq -r '.[-1] // empty')
          if [ -z "${THRESHOLD}" ]; then
            echo "::error::admin-required-from='@last' but environments is empty."
            exit 1
          fi
          echo "Threshold '@last' resolved to '${THRESHOLD}' (last entry of ${ENVIRONMENTS})."
        else
          THRESHOLD="${RAW_THRESHOLD}"
        fi

        THRESHOLD_IDX=$(echo "${ENVIRONMENTS}" | jq -r --arg e "${THRESHOLD}" 'index($e) // empty')
        if [ -z "${THRESHOLD_IDX}" ]; then
          echo "::error::admin-required-from='${THRESHOLD}' is not in environments=${ENVIRONMENTS}."
          exit 1
        fi
        if [ -z "${CURRENT_ENV}" ]; then
          echo "::error::Could not resolve current environment for the run."
          exit 1
        fi
        CURRENT_IDX=$(echo "${ENVIRONMENTS}" | jq -r --arg e "${CURRENT_ENV}" 'index($e) // empty')
        if [ -z "${CURRENT_IDX}" ]; then
          echo "::error::Resolved environment '${CURRENT_ENV}' is not in environments=${ENVIRONMENTS}."
          exit 1
        fi

        if [ "${CURRENT_IDX}" -lt "${THRESHOLD_IDX}" ]; then
          echo "Current env '${CURRENT_ENV}' is upstream of threshold '${THRESHOLD}' — guardrail not applied."
          exit 0
        fi

        PERM=$(gh api "/repos/${OWNER}/${REPO}/collaborators/${ACTOR}/permission" \
                 --jq '.permission' 2>/dev/null || echo "")
        if [ -z "${PERM}" ]; then
          echo "::error::Could not check repo permission for ${ACTOR} on ${OWNER}/${REPO}."
          echo "::error::The auth token needs Repository: Administration: Read. With auth-mode: public-app, grant that permission on the Diatreme App and accept it on the installation. To opt out of this guardrail, set admin-required-from: ''."
          exit 1
        fi
        if [ "${PERM}" != "admin" ]; then
          echo "::error::${ACTOR} is not a repo admin on ${OWNER}/${REPO} (permission=${PERM}). Manual releases to '${CURRENT_ENV}' require admin (threshold: '${THRESHOLD}'); merge a promotion PR instead."
          exit 1
        fi
        echo "✓ ${ACTOR} is a repo admin on ${OWNER}/${REPO} — manual release to '${CURRENT_ENV}' allowed."

    # Resolve the concrete versioning tool once, up front, so every tool step
    # below (and the normalize step) gates on a single detected value rather
    # than on the raw `versioning-tool` input. With `versioning-tool: auto`
    # (the default) this inspects `working-directory` for release-tooling
    # markers; with an explicit tool it validates and passes it through. Skipped
    # when version-override is set, since that path bypasses versioning entirely.
    - name: Resolve versioning tool
      id: resolve-tool
      if: inputs.mode == 'release' && inputs.version-override == ''
      shell: bash
      env:
        INPUT_VERSIONING_TOOL: ${{ inputs.versioning-tool }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        GITVERSION_CONFIG: ${{ inputs.gitversion-config }}
        RELEASE_PLEASE_CONFIG_FILE: ${{ inputs.release-please-config-file }}
      run: "${GITHUB_ACTION_PATH}/scripts/detect-versioning-tool.sh"

    - name: Run python-semantic-release
      id: psr
      if: inputs.mode == 'release' && inputs.version-override == '' && steps.resolve-tool.outputs.tool == 'semantic-release-python'
      # Pinned to v10.4.1 — the last release whose GitHub Action container is
      # built FROM python:3.13-bookworm (Debian stable). v10.5.0+ switched the
      # container to python:3.14-slim-trixie, whose `apt install ... cargo`
      # build step breaks (apt exit 100) whenever Docker Hub rebuilds the
      # mutable trixie base or Debian's package index shifts. The image is
      # built at runtime from the action's Dockerfile, so a floating @v10 tag —
      # or even a v10.5.x SHA pin — still pulls the broken base; the only fix in
      # our control is to pin to a release whose Dockerfile uses a stable base.
      # Our own Checkout already runs fetch-depth: 0, so we don't rely on the
      # v10.5.0 auto-unshallow feature. Revisit once upstream restores a stable
      # base image: https://github.com/python-semantic-release/python-semantic-release
      uses: python-semantic-release/python-semantic-release@4d4cb0ab842247caea1963132c242c62aab1e4d5 # v10.4.1
      with:
        github_token: ${{ steps.auth.outputs.token }}
        git_committer_name: github-actions[bot]
        prerelease: ${{ steps.detect-env.outputs.is_prerelease }}
        prerelease_token: ${{ steps.detect-env.outputs.prerelease_identifier }}
        force: ${{ inputs.force-bump }}
        build: false
        changelog: ${{ inputs.changelog }}
        # Force vcs_release off here. The action's `create-release` input
        # is honoured downstream by the Publish GitHub Release step, which
        # runs *after* image promotion so `release:published` listeners
        # see the versioned image in the registry. Letting psr create the
        # release inline (its default) would re-introduce the image-vs-
        # release race for any caller using the python-semantic-release
        # tool. The tag is still pushed here so the rest of the pipeline
        # (image promote, version-file inject, etc.) has the tag to work
        # with.
        vcs_release: false
        commit: true
        directory: ${{ inputs.working-directory }}

    - name: Set up Node.js (semantic-release-npm)
      if: inputs.mode == 'release' && inputs.version-override == '' && steps.resolve-tool.outputs.tool == 'semantic-release-npm'
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '20'

    - name: Run semantic-release (npm)
      id: semrel-npm
      if: inputs.mode == 'release' && inputs.version-override == '' && steps.resolve-tool.outputs.tool == 'semantic-release-npm'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ steps.auth.outputs.token }}
        GIT_AUTHOR_NAME: github-actions[bot]
        GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
        GIT_COMMITTER_NAME: github-actions[bot]
        GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        DETECT_IS_PRERELEASE: ${{ steps.detect-env.outputs.is_prerelease }}
        DETECT_IDENTIFIER: ${{ steps.detect-env.outputs.prerelease_identifier }}
        INPUT_TAG_PREFIX: ${{ inputs.tag-prefix }}
        INPUT_PROMOTE_PREFIX: ${{ inputs.promote-branch-prefix }}
      run: |
        set -euo pipefail
        IS_PRERELEASE="${DETECT_IS_PRERELEASE}"
        IDENTIFIER="${DETECT_IDENTIFIER}"
        PREFIX="${INPUT_TAG_PREFIX}"
        PROMOTE_PREFIX="${INPUT_PROMOTE_PREFIX}"
        HEAD_REF="${GITHUB_HEAD_REF:-}"

        # Install semantic-release together with its plugins into the SAME
        # node_modules, then run the locally-installed binary. Running via
        # bare `npx semantic-release` can resolve semantic-release from an
        # isolated `_npx/<hash>` cache whose node_modules does not contain the
        # configured plugins, so non-bundled plugins like
        # @semantic-release/changelog and @semantic-release/git fail with
        # "Cannot find module '@semantic-release/changelog'". The plugin set is
        # derived from the consumer's config (plus our baseline) so anything
        # they configure is installed, not just a hard-coded list.
        SEMREL_PKGS=$("${GITHUB_ACTION_PATH}/scripts/semantic-release-deps.sh")
        echo "Installing semantic-release toolchain: ${SEMREL_PKGS}"
        # shellcheck disable=SC2086 # word-splitting is intentional here.
        npm install --no-save ${SEMREL_PKGS}
        SEMREL_BIN="$(pwd)/node_modules/.bin/semantic-release"

        if [ "${IS_PRERELEASE}" == "true" ]; then
          NEXT_VER=""

          if echo "${HEAD_REF}" | grep -qE "^${PROMOTE_PREFIX}/[^/]+/"; then
            # Promotion PR: derive base version from the branch name.
            # e.g. promote/staging/1.0.0-dev.1 → 1.0.0
            BRANCH_VERSION=$(echo "${HEAD_REF}" | cut -d'/' -f3)
            NEXT_VER=$(echo "${BRANCH_VERSION}" | sed 's/-[a-zA-Z][^.]*\.[0-9]*$//')
            echo "Promotion: base version ${NEXT_VER} from branch ${HEAD_REF}"
          else
            # Direct push to trunk: skip if no new qualifying commits since the
            # last prerelease tag for this identifier (prevents spurious releases
            # when a promotion PR merge commit is the only change).
            LAST_PRE_TAG=$(git tag -l "${PREFIX}*-${IDENTIFIER}.*" 2>/dev/null | sort -V | tail -1 || true)
            if [ -n "${LAST_PRE_TAG}" ]; then
              QUALIFYING=$(git log "${LAST_PRE_TAG}..HEAD" --pretty=format:"%s" 2>/dev/null | \
                grep -cE "^(feat|fix|perf)(\(.+\))?(!)?:" || true)
              if [ "${QUALIFYING:-0}" -eq 0 ]; then
                echo "No qualifying commits since ${LAST_PRE_TAG} — skipping"
                echo "latest_tag=${LAST_PRE_TAG}" >> "$GITHUB_OUTPUT"
                echo "released=false"             >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            # semantic-release v24 ignores --prerelease on stable branches; use
            # dry-run to get the next stable version, then create the tag manually.
            DRY_RUN_OUTPUT=$("${SEMREL_BIN}" --dry-run 2>&1 || true)
            echo "=== semantic-release dry-run output ==="
            echo "${DRY_RUN_OUTPUT}"
            echo "======================================="
            NEXT_VER=$(echo "${DRY_RUN_OUTPUT}" | \
              grep -iE "the next release version is" | \
              grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          fi

          if [ -n "${NEXT_VER}" ]; then
            PRE_NUM=1
            EXISTING=$(git tag -l "${PREFIX}${NEXT_VER}-${IDENTIFIER}.*" 2>/dev/null | sort -V | tail -1 || true)
            if [ -n "${EXISTING}" ]; then
              LAST_NUM="${EXISTING##*.}"
              PRE_NUM=$(( LAST_NUM + 1 ))
            fi
            NEW_TAG="${PREFIX}${NEXT_VER}-${IDENTIFIER}.${PRE_NUM}"
            echo "Creating prerelease tag: ${NEW_TAG}"
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            REMOTE_URL=$(git remote get-url origin)
            AUTHED_URL=$(echo "${REMOTE_URL}" | sed "s|https://|https://x-access-token:${GITHUB_TOKEN}@|")

            # Concurrency safety: a parallel run may have just published
            # the same tag. Check the remote first; on push race we re-
            # check and exit gracefully.
            if git ls-remote --tags "${AUTHED_URL}" "refs/tags/${NEW_TAG}" 2>/dev/null | grep -Fq "refs/tags/${NEW_TAG}"; then
              echo "::notice::Tag ${NEW_TAG} already exists on remote (parallel run won the race). Treating as no-op release."
              echo "latest_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
              echo "released=false"        >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git tag "${NEW_TAG}"
            if ! git push "${AUTHED_URL}" "${NEW_TAG}" 2>/tmp/tag_push.err; then
              if git ls-remote --tags "${AUTHED_URL}" "refs/tags/${NEW_TAG}" 2>/dev/null | grep -Fq "refs/tags/${NEW_TAG}"; then
                echo "::notice::Tag ${NEW_TAG} now exists on remote (parallel run beat us between check and push). Skipping."
                git tag -d "${NEW_TAG}" 2>/dev/null || true
                echo "latest_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
                echo "released=false"        >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::Failed to push tag ${NEW_TAG}: $(cat /tmp/tag_push.err 2>/dev/null | head -3)"
              exit 1
            fi
            # GitHub Release is published in a later step, after image
            # promotion, so downstream `release:published` listeners see
            # versioned images in the registry. The custom prerelease
            # note is threaded through outputs so the deferred publish
            # step preserves the original message format instead of
            # falling back to GitHub's auto-generated notes.
            echo "latest_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
            echo "released=true"         >> "$GITHUB_OUTPUT"
            echo "release_notes=Pre-release ${IDENTIFIER}.${PRE_NUM} for version ${NEXT_VER}" >> "$GITHUB_OUTPUT"
          else
            echo "No relevant commits for prerelease — skipping"
            EXISTING_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            echo "latest_tag=${EXISTING_TAG}" >> "$GITHUB_OUTPUT"
            echo "released=false"             >> "$GITHUB_OUTPUT"
          fi
        else
          if echo "${HEAD_REF}" | grep -qE "^${PROMOTE_PREFIX}/[^/]+/"; then
            # Promotion PR for prod: semantic-release refuses on pull_request events.
            # Extract stable version from branch name and create tag + release manually.
            # e.g. promote/prod/1.0.0-rc.1 → v1.0.0
            BRANCH_VERSION=$(echo "${HEAD_REF}" | cut -d'/' -f3)
            STABLE_VER=$(echo "${BRANCH_VERSION}" | sed 's/-[a-zA-Z][^.]*\.[0-9]*$//')
            NEW_TAG="${PREFIX}${STABLE_VER}"
            echo "Stable release: ${NEW_TAG} from promotion branch ${HEAD_REF}"
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            REMOTE_URL=$(git remote get-url origin)
            AUTHED_URL=$(echo "${REMOTE_URL}" | sed "s|https://|https://x-access-token:${GITHUB_TOKEN}@|")

            # Concurrency safety: same race protection as the prerelease
            # path above — a parallel run may have already cut this stable.
            if git ls-remote --tags "${AUTHED_URL}" "refs/tags/${NEW_TAG}" 2>/dev/null | grep -Fq "refs/tags/${NEW_TAG}"; then
              echo "::notice::Tag ${NEW_TAG} already exists on remote (parallel run won the race). Treating as no-op release."
              echo "latest_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
              echo "released=false"        >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git tag "${NEW_TAG}"
            if ! git push "${AUTHED_URL}" "${NEW_TAG}" 2>/tmp/tag_push.err; then
              if git ls-remote --tags "${AUTHED_URL}" "refs/tags/${NEW_TAG}" 2>/dev/null | grep -Fq "refs/tags/${NEW_TAG}"; then
                echo "::notice::Tag ${NEW_TAG} now exists on remote (parallel run beat us). Skipping."
                git tag -d "${NEW_TAG}" 2>/dev/null || true
                echo "latest_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
                echo "released=false"        >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::Failed to push tag ${NEW_TAG}: $(cat /tmp/tag_push.err 2>/dev/null | head -3)"
              exit 1
            fi
            # GitHub Release is published in a later step, after image
            # promotion, so downstream `release:published` listeners see
            # versioned images in the registry.
            echo "latest_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
            echo "released=true"         >> "$GITHUB_OUTPUT"
          else
            # Direct push or workflow_dispatch: run semantic-release normally.
            # Use || true so non-critical post-hook failures (e.g. PR label
            # permissions) don't abort the step after the release is published.
            PRE_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            "${SEMREL_BIN}" || echo "::warning::semantic-release exited non-zero (release may still have been created)"
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            echo "latest_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
            if [ -n "${LATEST_TAG}" ] && [ "${LATEST_TAG}" != "${PRE_TAG}" ]; then
              echo "released=true"  >> "$GITHUB_OUTPUT"
            else
              echo "released=false" >> "$GITHUB_OUTPUT"
            fi
          fi
        fi

    - name: Install GitVersion
      if: inputs.mode == 'release' && inputs.version-override == '' && steps.resolve-tool.outputs.tool == 'gitversion'
      uses: gittools/actions/gitversion/setup@v4
      with:
        versionSpec: ${{ inputs.gitversion-spec }}

    - name: Execute GitVersion
      id: gitversion
      if: inputs.mode == 'release' && inputs.version-override == '' && steps.resolve-tool.outputs.tool == 'gitversion'
      uses: gittools/actions/gitversion/execute@v4
      with:
        # Resolved by the detect step rather than read from the raw input,
        # because this action never sets `targetPath` — gittools therefore
        # resolves configFilePath against the workspace root, while detection
        # is scoped to `working-directory`. Taking the path from the detect
        # step keeps the two in agreement for a subdirectory project.
        #
        # gittools only passes `/config` when this is non-empty, and hard-errors
        # when it names a file that does not exist, so the detect step emits:
        # an explicit `gitversion-config` verbatim (a bad path must still fail
        # loudly), else the GitVersion.yml/.yaml it found under
        # `working-directory`, else empty — which is what lets a repo resolved
        # from a bare *.csproj/*.sln run on GitVersion's built-in defaults.
        configFilePath: ${{ steps.resolve-tool.outputs.config }}
        # GitVersion accepts /overrideconfig flags; map force-bump onto its
        # `increment` knob. Empty force-bump leaves GitVersion's branch
        # rules in charge. gittools/actions@v4 takes one key=value per
        # line via overrideConfig (replaces the v0 additionalArguments
        # /overrideconfig invocation that v4 no longer recognises).
        overrideConfig: |
          ${{
            inputs.force-bump == 'major' && 'increment=Major' ||
            inputs.force-bump == 'minor' && 'increment=Minor' ||
            inputs.force-bump == 'patch' && 'increment=Patch' ||
            ''
          }}

    - name: Create GitVersion release tag
      id: gitversion-tag
      if: inputs.mode == 'release' && inputs.version-override == '' && steps.resolve-tool.outputs.tool == 'gitversion'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ steps.auth.outputs.token }}
        DETECT_IS_PRERELEASE: ${{ steps.detect-env.outputs.is_prerelease }}
        DETECT_IDENTIFIER: ${{ steps.detect-env.outputs.prerelease_identifier }}
        INPUT_TAG_PREFIX: ${{ inputs.tag-prefix }}
        GITVERSION_MAJOR_MINOR_PATCH: ${{ steps.gitversion.outputs.majorMinorPatch }}
      run: |
        set -euo pipefail
        IS_PRERELEASE="${DETECT_IS_PRERELEASE}"
        IDENTIFIER="${DETECT_IDENTIFIER}"
        PREFIX="${INPUT_TAG_PREFIX}"
        if [ "${IS_PRERELEASE}" == "true" ]; then
          BASE="${GITVERSION_MAJOR_MINOR_PATCH}"
          LATEST=$(git tag -l "${PREFIX}${BASE}-${IDENTIFIER}.*" | sort -V | tail -1)
          if [ -z "${LATEST}" ]; then
            PRE_NUM=1
          else
            PRE_NUM=$(echo "${LATEST}" | grep -oE "${IDENTIFIER}\.[0-9]+" | cut -d. -f2)
            PRE_NUM=$((PRE_NUM + 1))
          fi
          VERSION="${BASE}-${IDENTIFIER}.${PRE_NUM}"
        else
          VERSION="${GITVERSION_MAJOR_MINOR_PATCH}"
        fi
        TAG="${PREFIX}${VERSION}"
        echo "Creating tag: ${TAG}"

        # Shared race-safe tag push. The script emits `released=true|false`
        # to $GITHUB_OUTPUT; we add the tool-specific outputs here.
        # GitHub Release is published in a later step, after image
        # promotion, so downstream `release:published` listeners see
        # versioned images in the registry.
        TAG="${TAG}" MESSAGE="chore(release): ${TAG}" \
          "${GITHUB_ACTION_PATH}/scripts/push-release-tag.sh"

        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"

    - name: Create version-override release tag
      id: version-override-tag
      if: inputs.mode == 'release' && inputs.version-override != ''
      shell: bash
      env:
        GITHUB_TOKEN: ${{ steps.auth.outputs.token }}
        OVERRIDE_VERSION: ${{ steps.version-override.outputs.version }}
        OVERRIDE_TAG: ${{ steps.version-override.outputs.tag }}
      run: |
        set -euo pipefail
        VERSION="${OVERRIDE_VERSION}"
        TAG="${OVERRIDE_TAG}"
        echo "Creating tag: ${TAG}"

        # Shared race-safe tag push. The script emits `released=true|false`
        # to $GITHUB_OUTPUT; we add the tool-specific outputs here.
        TAG="${TAG}" MESSAGE="chore(release): ${TAG}" \
          "${GITHUB_ACTION_PATH}/scripts/push-release-tag.sh"

        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"

    - name: Run release-please
      id: release-please
      if: inputs.mode == 'release' && inputs.version-override == '' && steps.resolve-tool.outputs.tool == 'release-please'
      uses: googleapis/release-please-action@v5
      with:
        token: ${{ steps.auth.outputs.token }}
        release-type: ${{ inputs.release-please-release-type }}
        config-file: ${{ inputs.release-please-config-file }}

    - name: Normalize outputs
      id: normalize
      if: inputs.mode == 'release'
      shell: bash
      env:
        INPUT_TOOL: ${{ steps.resolve-tool.outputs.tool }}
        INPUT_PREFIX: ${{ inputs.tag-prefix }}
        INPUT_VERSION_OVERRIDE: ${{ inputs.version-override }}
        OVERRIDE_TAG_VERSION: ${{ steps.version-override-tag.outputs.version }}
        OVERRIDE_TAG_TAG: ${{ steps.version-override-tag.outputs.tag }}
        OVERRIDE_TAG_RELEASED: ${{ steps.version-override-tag.outputs.released }}
        PSR_VERSION: ${{ steps.psr.outputs.version }}
        PSR_RELEASED: ${{ steps.psr.outputs.released }}
        PSR_TAG: ${{ steps.psr.outputs.tag }}
        SEMREL_NPM_LATEST_TAG: ${{ steps.semrel-npm.outputs.latest_tag }}
        SEMREL_NPM_RELEASED: ${{ steps.semrel-npm.outputs.released }}
        SEMREL_NPM_RELEASE_NOTES: ${{ steps.semrel-npm.outputs.release_notes }}
        GITVERSION_TAG_VERSION: ${{ steps.gitversion-tag.outputs.version }}
        GITVERSION_TAG_TAG: ${{ steps.gitversion-tag.outputs.tag }}
        GITVERSION_TAG_RELEASED: ${{ steps.gitversion-tag.outputs.released }}
        RELEASE_PLEASE_CREATED: ${{ steps.release-please.outputs.release_created }}
        RELEASE_PLEASE_TAG_NAME: ${{ steps.release-please.outputs.tag_name }}
      run: |
        set -euo pipefail
        TOOL="${INPUT_TOOL}"
        PREFIX="${INPUT_PREFIX}"
        VERSION=""
        RELEASED="false"
        TAG=""
        RELEASE_NOTES=""
        if [ -n "${INPUT_VERSION_OVERRIDE}" ]; then
          VERSION="${OVERRIDE_TAG_VERSION}"
          TAG="${OVERRIDE_TAG_TAG}"
          RELEASED="${OVERRIDE_TAG_RELEASED}"
        else
          case "${TOOL}" in
            semantic-release-python)
              VERSION="${PSR_VERSION}"
              RELEASED="${PSR_RELEASED}"
              TAG="${PSR_TAG}"
              ;;
            semantic-release-npm)
              LATEST_TAG="${SEMREL_NPM_LATEST_TAG}"
              RELEASED="${SEMREL_NPM_RELEASED}"
              if [ -n "${LATEST_TAG}" ]; then
                VERSION="${LATEST_TAG#${PREFIX}}"
                TAG="${LATEST_TAG}"
              fi
              # Only the prerelease branch emits release_notes; stable
              # and promotion-PR paths fall through to --generate-notes.
              RELEASE_NOTES="${SEMREL_NPM_RELEASE_NOTES}"
              ;;
            gitversion)
              VERSION="${GITVERSION_TAG_VERSION}"
              TAG="${GITVERSION_TAG_TAG}"
              # The gitversion-tag step emits released=false when it
              # detects a parallel run beat us to publishing the same tag.
              # Default to true for the no-conflict case so existing
              # callers see no behaviour change.
              RELEASED="${GITVERSION_TAG_RELEASED}"
              [ -z "${RELEASED}" ] && RELEASED="true"
              ;;
            release-please)
              if [ "${RELEASE_PLEASE_CREATED}" == "true" ]; then
                TAG="${RELEASE_PLEASE_TAG_NAME}"
                VERSION="${TAG#${PREFIX}}"
                RELEASED="true"
              fi
              ;;
          esac
        fi
        if [ -z "${VERSION}" ]; then
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "${LATEST}" ]; then
            VERSION="${LATEST#${PREFIX}}"
            TAG="${LATEST}"
          fi
        fi
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"
        echo "released=${RELEASED}" >> "$GITHUB_OUTPUT"
        echo "release_notes=${RELEASE_NOTES}" >> "$GITHUB_OUTPUT"
        echo "Tool: ${TOOL} | Version: ${VERSION} | Tag: ${TAG} | Released: ${RELEASED}"

    # ═════════════════════════════════════════════════════════════════════════
    # RELEASE MODE — Persist version into a tracked file (any tool)
    # ═════════════════════════════════════════════════════════════════════════
    #
    # Common in .NET deployments (e.g. appsettings.json) and Helm charts
    # (Chart.yaml appVersion) where the running app or chart needs to know
    # its own version. JSON files are processed with jq; YAML files (.yaml/
    # .yml) are processed with yq. Works with every versioning tool and runs
    # only when a release was created.
    #
    # The push uses the resolved release auth token, so it bypasses branch
    # protection rulesets when the Diatreme App (or your private app)
    # is in the bypass list. The commit message ends with `[skip ci]` so
    # the push does not retrigger the release workflow.

    - name: Inject version into tracked file
      id: version-file-inject
      if: |
        inputs.mode == 'release' &&
        steps.normalize.outputs.released == 'true' &&
        (inputs.version-file != '' || inputs.gitversion-appsettings-file != '')
      shell: bash
      env:
        GITHUB_TOKEN: ${{ steps.auth.outputs.token }}
        INPUT_VERSION_FILE: ${{ inputs.version-file }}
        INPUT_VERSION_FILE_JSON_PATH: ${{ inputs.version-file-json-path }}
        INPUT_VERSION_FILE_YAML_PATH: ${{ inputs.version-file-yaml-path }}
        INPUT_GITVERSION_APPSETTINGS_FILE: ${{ inputs.gitversion-appsettings-file }}
        INPUT_GITVERSION_APPSETTINGS_VERSION_PATH: ${{ inputs.gitversion-appsettings-version-path }}
        NORMALIZE_VERSION: ${{ steps.normalize.outputs.version }}
      run: |
        set -euo pipefail

        # Prefer the new generic input. Fall back to the deprecated gitversion-prefixed
        # alias so existing callers keep working.
        FILE="${INPUT_VERSION_FILE}"
        JSON_PATH="${INPUT_VERSION_FILE_JSON_PATH}"
        YAML_PATH="${INPUT_VERSION_FILE_YAML_PATH}"
        if [ -z "${FILE}" ]; then
          FILE="${INPUT_GITVERSION_APPSETTINGS_FILE}"
          if [ -n "${INPUT_GITVERSION_APPSETTINGS_VERSION_PATH}" ]; then
            JSON_PATH="${INPUT_GITVERSION_APPSETTINGS_VERSION_PATH}"
          fi
          echo "::notice::gitversion-appsettings-file is deprecated; use version-file."
        fi

        VERSION="${NORMALIZE_VERSION}"

        if [ ! -f "${FILE}" ]; then
          echo "::warning::version-file '${FILE}' not found — skipping injection."
          exit 0
        fi
        if [ -z "${VERSION}" ]; then
          echo "::warning::No version resolved — skipping injection."
          exit 0
        fi

        # Detect file format by extension: .yaml/.yml → yq; anything else → jq.
        # Tolerate a bad path expression or unexpected content rather than
        # failing the release — version-file is opt-in plumbing and
        # mis-configuring it should warn, not block the publish.
        TMP=$(mktemp)
        if [[ "${FILE}" =~ \.(yaml|yml)$ ]]; then
          # Pass VERSION via env so it isn't interpolated into the expression.
          if ! _INJECT_VERSION="${VERSION}" yq "${YAML_PATH} = strenv(_INJECT_VERSION)" "${FILE}" > "${TMP}" 2>/tmp/yq.err; then
            echo "::warning::Failed to inject version into ${FILE} at path '${YAML_PATH}': $(cat /tmp/yq.err 2>/dev/null | head -1). Skipping."
            rm -f "${TMP}"
            exit 0
          fi
          USED_PATH="${YAML_PATH}"
        else
          if ! jq --arg v "${VERSION}" "${JSON_PATH} = \$v" "${FILE}" > "${TMP}" 2>/tmp/jq.err; then
            echo "::warning::Failed to inject version into ${FILE} at path '${JSON_PATH}': $(cat /tmp/jq.err 2>/dev/null | head -1). Skipping."
            rm -f "${TMP}"
            exit 0
          fi
          USED_PATH="${JSON_PATH}"
        fi
        if ! mv "${TMP}" "${FILE}"; then
          echo "::warning::Failed to write ${FILE} after injection — skipping."
          exit 0
        fi
        echo "Injected version ${VERSION} into ${FILE} at ${USED_PATH}"

        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add "${FILE}"
        if git diff --cached --quiet; then
          echo "No changes to commit — file already at ${VERSION}."
          exit 0
        fi

        git commit -m "chore(release): persist version ${VERSION} in $(basename "${FILE}") [skip ci]"

        # Concurrency-safe push loop: another run on the same branch may
        # land a commit (Flux image bump, parallel release run, etc.)
        # between our fetch and our push. We rebase, push, and on
        # rejection re-fetch and retry up to MAX_ATTEMPTS times with
        # short backoff. Callers that need workflow-level serialization
        # should add their own `concurrency:` group; this loop covers
        # concurrent commits from automation outside such a group.
        BRANCH="${GITHUB_REF_NAME}"
        REMOTE_URL=$(git remote get-url origin)
        AUTHED_URL=$(echo "${REMOTE_URL}" | sed "s|https://|https://x-access-token:${GITHUB_TOKEN}@|")
        MAX_ATTEMPTS=5

        for attempt in $(seq 1 ${MAX_ATTEMPTS}); do
          git fetch origin "${BRANCH}" 2>&1 | tail -3 || true
          if ! git rebase "origin/${BRANCH}"; then
            git rebase --abort 2>/dev/null || true
            if [ "${attempt}" -eq "${MAX_ATTEMPTS}" ]; then
              echo "::warning::Could not rebase ${FILE} commit onto latest ${BRANCH} after ${MAX_ATTEMPTS} attempts; skipping push."
              exit 0
            fi
            sleep $((attempt * 2))
            continue
          fi

          if git push "${AUTHED_URL}" "HEAD:${BRANCH}" 2>/tmp/push.err; then
            echo "Pushed ${FILE} update for ${VERSION} to ${BRANCH} on attempt ${attempt}/${MAX_ATTEMPTS}."
            exit 0
          fi

          # Common race: another run pushed between our fetch and push.
          # Re-fetch and retry. Stop early if the failure is non-recoverable
          # (e.g. branch protection rejection without bypass).
          if grep -qiE "non-fast-forward|fetch first|stale" /tmp/push.err; then
            echo "Push attempt ${attempt}/${MAX_ATTEMPTS} lost a race; will rebase + retry"
            sleep $((attempt * 2))
            continue
          fi

          # Anything else (auth failure, ruleset block, etc.) — don't keep
          # banging on the door; surface it as a warning and move on so
          # the rest of the release flow still completes.
          echo "::warning::Could not push ${FILE} commit: $(cat /tmp/push.err | head -3). Continuing release."
          exit 0
        done

        echo "::warning::Exhausted ${MAX_ATTEMPTS} push attempts for ${FILE} on ${BRANCH}; skipping push."

    # ═════════════════════════════════════════════════════════════════════════
    # RELEASE MODE — Docker image promotion
    # ═════════════════════════════════════════════════════════════════════════

    - name: Set up Docker Buildx (release)
      if: inputs.mode == 'release' && steps.resolve-image.outputs.image_name != '' && steps.normalize.outputs.released == 'true'
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    - name: Log in to container registry (release)
      if: inputs.mode == 'release' && steps.resolve-image.outputs.image_name != '' && steps.normalize.outputs.released == 'true'
      uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username || github.actor }}
        password: ${{ inputs.registry-password || steps.auth.outputs.registry-token }}

    - name: Promote images
      if: inputs.mode == 'release' && steps.resolve-image.outputs.image_name != '' && steps.normalize.outputs.released == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.auth.outputs.token }}
        BAKE_GITHUB_TOKEN: ${{ inputs.build-github-token }}
        NORMALIZE_VERSION: ${{ steps.normalize.outputs.version }}
        NORMALIZE_TAG: ${{ steps.normalize.outputs.tag }}
        DETECT_ENV: ${{ steps.detect-env.outputs.environment }}
        DETECT_IS_PRERELEASE: ${{ steps.detect-env.outputs.is_prerelease }}
        INPUT_DEPLOYMENT_MODEL: ${{ inputs.deployment-model }}
        INPUT_ENVIRONMENTS: ${{ inputs.environments }}
        INPUT_PRERELEASE_IDENTIFIERS: ${{ inputs.prerelease-identifiers }}
        INPUT_TAG_PREFIX: ${{ inputs.tag-prefix }}
        OWNER: ${{ github.repository_owner }}
        INPUT_IMAGE_NAME: ${{ steps.resolve-image.outputs.image_name }}
        INPUT_REGISTRY: ${{ inputs.registry }}
        INPUT_PLATFORMS: ${{ inputs.platforms }}
        INPUT_BAKE_FILE: ${{ inputs.bake_file }}
        INPUT_BAKE_TARGET: ${{ inputs.bake_target }}
        REPO_FULL: ${{ github.repository }}
      run: |
        set -euo pipefail

        VERSION="${NORMALIZE_VERSION}"
        TAG="${NORMALIZE_TAG}"
        ENV="${DETECT_ENV}"
        IS_PRERELEASE="${DETECT_IS_PRERELEASE}"
        DEPLOY_MODEL="${INPUT_DEPLOYMENT_MODEL}"
        ENVS="${INPUT_ENVIRONMENTS}"
        IDS="${INPUT_PRERELEASE_IDENTIFIERS}"
        PREFIX="${INPUT_TAG_PREFIX}"

        OWNER_LOWER=$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')
        export IMAGE_NAME="${OWNER_LOWER}/${INPUT_IMAGE_NAME}"
        export REGISTRY="${INPUT_REGISTRY}"
        export VERSION="${VERSION}"
        export PLATFORMS="${INPUT_PLATFORMS}"

        # Discover all bake targets
        BAKE_OUTPUT=$(docker buildx bake -f "${INPUT_BAKE_FILE}" "${INPUT_BAKE_TARGET}" --print 2>/dev/null)
        IMAGES=$(echo "${BAKE_OUTPUT}" | jq -c '.target | to_entries | map({target: .key, image: (.value.tags[0] // "" | split(":")[0])})')
        echo "Images to promote: ${IMAGES}"

        # Determine promotion strategy
        IS_FIRST_ENV="false"
        PREV_IDENTIFIER=""
        if [ "${DEPLOY_MODEL}" == "bbd" ]; then
          IS_FIRST_ENV="true"
          echo "BBD: every environment uses its own pr-<N> image"
        else
          FIRST_ENV=$(echo "${ENVS}" | jq -r '.[0]')
          if [ "${ENV}" == "${FIRST_ENV}" ]; then
            IS_FIRST_ENV="true"
            echo "TBD: first environment — will look for pr-<N>"
          else
            ENV_INDEX=$(echo "${ENVS}" | jq -r --arg e "${ENV}" 'index($e)')
            PREV_ENV=$(echo "${ENVS}" | jq -r --argjson i "${ENV_INDEX}" '.[$i - 1]')
            PREV_IDENTIFIER=$(echo "${IDS}" | jq -r --arg e "${PREV_ENV}" '.[$e] // "dev"')
            echo "TBD: subsequent environment — will retag from ${PREV_IDENTIFIER} version"
          fi
        fi

        # Resolve source tag suffix
        SOURCE_TAG_SUFFIX=""
        if [ "${IS_FIRST_ENV}" == "true" ]; then
          # Find the PR associated with this release tag via GitHub API
          COMMIT_SHA=$(gh api "repos/${REPO_FULL}/git/ref/tags/${TAG}" \
            --jq 'if .object.type == "tag" then .object.sha else .object.sha end' 2>/dev/null || echo "")

          if [ -n "${COMMIT_SHA}" ]; then
            # Resolve annotated tag to commit
            TAG_TYPE=$(gh api "repos/${REPO_FULL}/git/ref/tags/${TAG}" --jq '.object.type' 2>/dev/null || echo "commit")
            if [ "${TAG_TYPE}" == "tag" ]; then
              COMMIT_SHA=$(gh api "repos/${REPO_FULL}/git/tags/${COMMIT_SHA}" --jq '.object.sha' 2>/dev/null || echo "${COMMIT_SHA}")
            fi

            PR_NUMBER=""
            CURRENT_SHA="${COMMIT_SHA}"
            for _ in 1 2 3 4 5; do
              PR_NUMBER=$(gh api "repos/${REPO_FULL}/commits/${CURRENT_SHA}/pulls" \
                --jq '[.[] | select(.merged_at != null)] | .[0].number // empty' 2>/dev/null || echo "")
              [ -n "${PR_NUMBER}" ] && break
              # Check commit message for PR reference
              MSG_PR=$(gh api "repos/${REPO_FULL}/commits/${CURRENT_SHA}" \
                --jq '.commit.message' 2>/dev/null | grep -oE '\(#[0-9]+\)|Merge pull request #[0-9]+' | grep -oE '[0-9]+' | head -1 || echo "")
              if [ -n "${MSG_PR}" ]; then
                PR_NUMBER="${MSG_PR}"
                break
              fi
              CURRENT_SHA=$(gh api "repos/${REPO_FULL}/commits/${CURRENT_SHA}" \
                --jq '.parents[0].sha // empty' 2>/dev/null || echo "")
              [ -z "${CURRENT_SHA}" ] && break
            done

            if [ -n "${PR_NUMBER}" ]; then
              SOURCE_TAG_SUFFIX="pr-${PR_NUMBER}"
              echo "Source: pr-${PR_NUMBER}"
            else
              echo "::warning::Could not find PR for tag ${TAG} — will fall back to fresh build"
            fi
          fi
        else
          # Find latest tag with the previous environment's identifier
          BASE_VERSION=$(echo "${VERSION}" | sed 's/-[a-zA-Z][^.]*\.[0-9]*$//')
          SEARCH_PREFIX="${PREFIX}${BASE_VERSION}-${PREV_IDENTIFIER}."
          SOURCE_TAG_SUFFIX=$(gh api "repos/${REPO_FULL}/git/matching-refs/tags/${SEARCH_PREFIX}" \
            --jq '[.[].ref | ltrimstr("refs/tags/")] | sort_by(ltrimstr("'"${PREFIX}${BASE_VERSION}-${PREV_IDENTIFIER}."'") | tonumber) | last // empty' \
            2>/dev/null || echo "")
          if [ -n "${SOURCE_TAG_SUFFIX}" ]; then
            echo "Source tag: ${SOURCE_TAG_SUFFIX}"
          else
            echo "::warning::No tag found matching ${SEARCH_PREFIX}* — will fall back to fresh build"
          fi
        fi

        # Promote each image
        echo "${IMAGES}" | jq -c '.[]' | while IFS= read -r item; do
          TARGET=$(echo "${item}" | jq -r '.target')
          IMAGE=$(echo "${item}" | jq -r '.image')
          NEW_TAG="${IMAGE}:${TAG}"

          PROMOTED="false"
          if [ -n "${SOURCE_TAG_SUFFIX}" ]; then
            SOURCE="${IMAGE}:${SOURCE_TAG_SUFFIX}"

            # Primary retag: `docker buildx imagetools create`. Preserves
            # multi-arch manifest lists — a `docker pull` on a fat manifest
            # would resolve to the runner's platform only and silently drop
            # the other architectures. Works on every registry that
            # implements the OCI referrers spec (ghcr.io, Docker Hub, ACR,
            # Harbor, Artifactory, Nexus, etc.).
            RETAG_OK=true
            RETAG_METHOD="imagetools"
            RETAG_ERR=$(mktemp)
            if [ "${IS_PRERELEASE}" == "false" ]; then
              docker buildx imagetools create --tag "${NEW_TAG}" --tag "${IMAGE}:latest" "${SOURCE}" 2>"${RETAG_ERR}" || RETAG_OK=false
            else
              docker buildx imagetools create --tag "${NEW_TAG}" "${SOURCE}" 2>"${RETAG_ERR}" || RETAG_OK=false
            fi

            # Fallback: when imagetools fails specifically with the GHE
            # Packages referrers-index parse error (the registry returns
            # an HTML 404 page where buildx expects JSON), retry via the
            # plain Distribution V2 pull/tag/push flow. This loses
            # multi-arch manifest lists, so we log it loudly and only
            # take this path when the referrers signature is matched —
            # not for generic retag failures.
            if [ "${RETAG_OK}" != "true" ] && grep -q "failed to decode referrers index" "${RETAG_ERR}"; then
              echo "::warning::imagetools retag failed on a referrers-index parse (likely GHE Packages). Falling back to docker pull/tag/push — multi-arch manifest lists will collapse to the runner's platform on this retag."
              RETAG_OK=true
              RETAG_METHOD="pull-tag-push"
              docker pull "${SOURCE}" || RETAG_OK=false
              if [ "${RETAG_OK}" == "true" ]; then
                docker tag "${SOURCE}" "${NEW_TAG}" || RETAG_OK=false
              fi
              if [ "${RETAG_OK}" == "true" ] && [ "${IS_PRERELEASE}" == "false" ]; then
                docker tag "${SOURCE}" "${IMAGE}:latest" || RETAG_OK=false
              fi
              if [ "${RETAG_OK}" == "true" ]; then
                docker push "${NEW_TAG}" || RETAG_OK=false
              fi
              if [ "${RETAG_OK}" == "true" ] && [ "${IS_PRERELEASE}" == "false" ]; then
                docker push "${IMAGE}:latest" || RETAG_OK=false
              fi
            fi
            rm -f "${RETAG_ERR}"

            if [ "${RETAG_OK}" == "true" ]; then
              if [ "${IS_PRERELEASE}" == "false" ]; then
                echo "Promoted ${SOURCE} → ${NEW_TAG} + :latest via ${RETAG_METHOD}"
              else
                echo "Promoted ${SOURCE} → ${NEW_TAG} via ${RETAG_METHOD}"
              fi
              PROMOTED="true"
            else
              echo "::warning::retag of ${SOURCE} → ${NEW_TAG} failed (last method: ${RETAG_METHOD}); falling back to fresh build."
            fi
          fi

          if [ "${PROMOTED}" == "false" ]; then
            echo "Fresh build fallback for ${IMAGE} (${TARGET})"
            EXTRA_TAGS=""
            [ "${IS_PRERELEASE}" == "false" ] && EXTRA_TAGS="--set ${TARGET}.tags=${IMAGE}:latest"
            docker buildx bake \
              -f "${INPUT_BAKE_FILE}" "${TARGET}" \
              --set "${TARGET}.tags=${NEW_TAG}" \
              ${EXTRA_TAGS} \
              --set "${TARGET}.cache-from=type=gha,scope=buildkit-${TARGET}" \
              --set "${TARGET}.cache-to=type=gha,mode=max,scope=buildkit-${TARGET}" \
              --push
          fi
        done

    # ═════════════════════════════════════════════════════════════════════════
    # RELEASE MODE — Native package publishing (opt-in)
    # ═════════════════════════════════════════════════════════════════════════
    #
    # Pack and push a language package (NuGet / pip / npm) to a configurable
    # feed, using the version diatreme just computed. Opt-in via
    # `publish-package: true`, gated on `released == 'true'` exactly like
    # image promotion — so environment/branch logic is inherited: each run
    # targets one environment and publishes that environment's version
    # (prereleases on dev/staging, stable on prod; the prerelease state is
    # carried in the version string, e.g. 1.2.3-rc.1).
    #
    # Runs after image promotion and before the GitHub Release is published,
    # so a downstream `release:published` listener finds the package already
    # available in the feed — the same race-avoidance ordering used for the
    # Docker image promote step.

    - name: Set up .NET (package publishing)
      if: |
        inputs.mode == 'release' &&
        inputs.publish-package == 'true' &&
        inputs.package-ecosystem == 'nuget' &&
        steps.normalize.outputs.released == 'true'
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Set up Python (package publishing)
      if: |
        inputs.mode == 'release' &&
        inputs.publish-package == 'true' &&
        inputs.package-ecosystem == 'pip' &&
        steps.normalize.outputs.released == 'true'
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up Node.js (package publishing)
      if: |
        inputs.mode == 'release' &&
        inputs.publish-package == 'true' &&
        inputs.package-ecosystem == 'npm' &&
        steps.normalize.outputs.released == 'true'
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Set up Java (package publishing)
      if: |
        inputs.mode == 'release' &&
        inputs.publish-package == 'true' &&
        (inputs.package-ecosystem == 'maven' || inputs.package-ecosystem == 'gradle') &&
        steps.normalize.outputs.released == 'true'
      uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}

    - name: Set up Ruby (package publishing)
      if: |
        inputs.mode == 'release' &&
        inputs.publish-package == 'true' &&
        inputs.package-ecosystem == 'rubygems' &&
        steps.normalize.outputs.released == 'true'
      uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1.316.0
      with:
        ruby-version: ${{ inputs.ruby-version }}

    # No setup step for `container` — docker is preinstalled on the runners; the
    # script does `docker login`/`build`/`push` directly.

    - name: Publish package
      id: publish-package
      if: |
        inputs.mode == 'release' &&
        inputs.publish-package == 'true' &&
        steps.normalize.outputs.released == 'true'
      shell: bash
      env:
        ECOSYSTEM: ${{ inputs.package-ecosystem }}
        VERSION: ${{ steps.normalize.outputs.version }}
        # Registry-login token. Defaults to the workflow GITHUB_TOKEN
        # (resolve-auth-token.sh exposes it as registry-token), which is what
        # GitHub Packages feeds expect with `packages: write` — independent of
        # the git/release auth token used for tagging.
        TOKEN: ${{ inputs.package-token || steps.auth.outputs.registry-token }}
        FEED_URL: ${{ inputs.package-feed-url }}
        PACKAGE_PATH: ${{ inputs.package-path }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        USERNAME: ${{ inputs.package-username }}
        OWNER: ${{ github.repository_owner }}
        REPOSITORY: ${{ github.repository }}
        PACKAGE_NAME: ${{ inputs.package-name }}
        IS_PRERELEASE: ${{ steps.detect-env.outputs.is_prerelease }}
        PRERELEASE_IDENTIFIER: ${{ steps.detect-env.outputs.prerelease_identifier }}
        NPM_PROVENANCE: ${{ inputs.npm-provenance }}
        PYPI_TRUSTED_PUBLISHING: ${{ inputs.pypi-trusted-publishing }}
      run: "${GITHUB_ACTION_PATH}/scripts/publish-package.sh"

    # ═════════════════════════════════════════════════════════════════════════
    # RELEASE MODE — Publish GitHub Release (deferred until after image promote)
    # ═════════════════════════════════════════════════════════════════════════
    #
    # Why this step is here and not inline with tag creation:
    # downstream workflows that listen for `release:published` (typical for
    # Cloud Run / k8s / GitOps deploys) start polling GHCR for the
    # versioned image the moment the release fires. If we publish the
    # release first and promote the image afterwards, those listeners
    # race the registry — they'll get "manifest unknown" / "not found"
    # for as long as image promotion + registry-API propagation takes.
    #
    # Publishing the release after image promotion makes the
    # `release:published` event a reliable readiness signal for the
    # versioned image, so consumers don't need arbitrary retry budgets.
    #
    # Idempotent: a few paths still publish the release inside an
    # external tool we don't control here — the semantic-release-npm
    # *direct trunk stable* path (the local `semantic-release` invocation
    # in this very file) and release-please. For those we detect the
    # pre-existing release and emit a notice; the image-vs-release race
    # remains until they're refactored too. python-semantic-release
    # used to be on this list but is no longer — we force its
    # `vcs_release` input off so the tag is created without a release,
    # then this step publishes once images are in place.

    - name: Publish GitHub Release
      if: |
        inputs.mode == 'release' &&
        inputs.create-release == 'true' &&
        steps.normalize.outputs.released == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.auth.outputs.token }}
        NORMALIZE_TAG: ${{ steps.normalize.outputs.tag }}
        NORMALIZE_RELEASE_NOTES: ${{ steps.normalize.outputs.release_notes }}
        DETECT_IS_PRERELEASE: ${{ steps.detect-env.outputs.is_prerelease }}
      run: |
        set -euo pipefail
        TAG="${NORMALIZE_TAG}"
        if [ -z "${TAG}" ]; then
          echo "::warning::No tag resolved by normalize step — skipping release publish."
          exit 0
        fi
        if gh release view "${TAG}" >/dev/null 2>&1; then
          echo "::notice::Release ${TAG} already exists (inner versioning tool published it before image promotion). Image-vs-release race may still apply for this tool — see action docs."
          exit 0
        fi
        PRE_FLAG=""
        if [ "${DETECT_IS_PRERELEASE}" == "true" ]; then
          PRE_FLAG="--prerelease"
        fi
        # Preserve any per-path custom release notes the tagging step
        # emitted (today only the semantic-release-npm prerelease block
        # uses this, with a "Pre-release X.N for version Y" message);
        # paths that don't emit one fall back to GitHub's auto-generated
        # notes which include the PRs and contributors in the release
        # range. Using an array avoids word-splitting the notes string.
        NOTES="${NORMALIZE_RELEASE_NOTES}"
        NOTES_FLAGS=(--generate-notes)
        if [ -n "${NOTES}" ]; then
          NOTES_FLAGS=(--notes "${NOTES}")
        fi
        # Retry the release create to absorb transient GitHub API hiccups
        # (5xx, rate limits, propagation lag for the tag we just pushed).
        # On persistent failure we fail the run — silently swallowing here
        # would leave the workflow green with no GitHub Release, and any
        # `release:published` listener (deploy / verify workflows) would
        # never fire.
        MAX_ATTEMPTS=5
        for attempt in $(seq 1 ${MAX_ATTEMPTS}); do
          if gh release create "${TAG}" \
               --title "${TAG}" \
               "${NOTES_FLAGS[@]}" \
               ${PRE_FLAG} 2>/tmp/release_create.err; then
            echo "Published GitHub Release ${TAG} on attempt ${attempt}/${MAX_ATTEMPTS}."
            exit 0
          fi
          # An earlier attempt may have actually succeeded before the
          # client errored (e.g. response timeout) — re-check before
          # retrying, since `gh release create` is not idempotent.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::notice::Release ${TAG} now exists (created on a prior attempt or by a concurrent runner). Continuing."
            exit 0
          fi
          ERR=$(head -3 /tmp/release_create.err 2>/dev/null || echo "")
          if [ "${attempt}" -lt "${MAX_ATTEMPTS}" ]; then
            echo "::warning::Attempt ${attempt}/${MAX_ATTEMPTS} to create Release ${TAG} failed: ${ERR}. Retrying."
            sleep $((attempt * 5))
          else
            echo "::error::Failed to create GitHub Release ${TAG} after ${MAX_ATTEMPTS} attempts: ${ERR}. The tag is pushed but downstream release-event listeners will not fire — delete the tag and re-run, or create the release manually."
            exit 1
          fi
        done

    # ═════════════════════════════════════════════════════════════════════════
    # RELEASE MODE — Promotion PR (tbd-pr model, opt-in)
    # ═════════════════════════════════════════════════════════════════════════

    - name: Create promotion PR
      if: |
        inputs.mode == 'release' &&
        inputs.create-promotion-pr == 'true' &&
        inputs.deployment-model == 'tbd-pr' &&
        steps.normalize.outputs.released == 'true' &&
        steps.detect-env.outputs.is_prerelease == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.auth.outputs.token }}
        OWNER: ${{ github.repository_owner }}
        REPO: ${{ github.event.repository.name }}
        NORMALIZE_VERSION: ${{ steps.normalize.outputs.version }}
        NORMALIZE_TAG: ${{ steps.normalize.outputs.tag }}
        DETECT_ENV: ${{ steps.detect-env.outputs.environment }}
        DETECT_PRERELEASE_IDENTIFIER: ${{ steps.detect-env.outputs.prerelease_identifier }}
        INPUT_ENVIRONMENTS: ${{ inputs.environments }}
        INPUT_PROMOTE_BRANCH_PREFIX: ${{ inputs.promote-branch-prefix }}
        INPUT_PROMOTE_TARGET_BRANCH: ${{ inputs.promote-target-branch }}
      run: |
        set -euo pipefail

        VERSION="${NORMALIZE_VERSION}"
        TAG="${NORMALIZE_TAG}"
        ENV="${DETECT_ENV}"
        PRERELEASE_IDENTIFIER="${DETECT_PRERELEASE_IDENTIFIER}"
        ENVS="${INPUT_ENVIRONMENTS}"
        PREFIX="${INPUT_PROMOTE_BRANCH_PREFIX}"
        TARGET="${INPUT_PROMOTE_TARGET_BRANCH}"

        LAST_ENV=$(echo "${ENVS}" | jq -r '.[-1]')
        if [ "${ENV}" == "${LAST_ENV}" ]; then
          echo "Already at last environment — no promotion PR needed"
          exit 0
        fi

        ENV_INDEX=$(echo "${ENVS}" | jq -r --arg e "${ENV}" 'index($e)')
        NEXT_ENV=$(echo "${ENVS}" | jq -r --argjson i "${ENV_INDEX}" '.[$i + 1]')
        TITLE="chore(release): promote ${TAG} to ${NEXT_ENV}"

        # Build a rich body so reviewers see the originating PR, the
        # full PR list in the range, and the source/target environments
        # without clicking through. Falls back to a one-line body if
        # the script errors for any reason — never block PR creation.
        render_body() {
          local out="$1"
          if env \
              GH_TOKEN="${GH_TOKEN}" \
              OWNER="${OWNER}" REPO="${REPO}" \
              TAG="${TAG}" VERSION="${VERSION}" \
              ENV="${ENV}" NEXT_ENV="${NEXT_ENV}" \
              PRERELEASE_IDENTIFIER="${PRERELEASE_IDENTIFIER}" \
              PROMOTE_BRANCH_PREFIX="${PREFIX}" \
              "${GITHUB_ACTION_PATH}/scripts/build-promotion-pr-body.sh" > "${out}" 2>/dev/null \
              && [ -s "${out}" ]; then
            echo "Using enriched PR body ($(wc -l < "${out}") lines)."
          else
            echo "::warning::Could not render enriched PR body — falling back to one-liner."
            printf 'Merging this PR will trigger the **%s** release for `%s`.\n' \
              "${NEXT_ENV}" "${TAG}" > "${out}"
          fi
        }

        # One open promotion PR per target environment. If one is
        # already open for NEXT_ENV (any version), refresh its title +
        # body to the latest tag and exit — don't pile up duplicates.
        # The version in the title is metadata; the cut version comes
        # from semantic-release running on whatever commit lands on the
        # target branch at merge time, so we tell the reviewer to click
        # "Update Branch" before merging to bring the latest commits in.
        EXISTING_NUM=$(gh pr list \
          --state open --base "${TARGET}" \
          --json number,headRefName \
          --jq "first(.[] | select(.headRefName | startswith(\"${PREFIX}/${NEXT_ENV}/\")) | .number) // empty")

        if [ -n "${EXISTING_NUM}" ]; then
          echo "Refreshing existing promotion PR #${EXISTING_NUM} to ${TAG}"
          BODY_FILE=$(mktemp)
          render_body "${BODY_FILE}"
          # Prepend a callout so reviewers know to click Update Branch.
          TMP=$(mktemp)
          {
            printf '> **Latest available:** `%s`. Click **Update Branch** on this PR before merging so the cut reflects the latest commits on `%s`.\n\n' \
              "${TAG}" "${TARGET}"
            cat "${BODY_FILE}"
          } > "${TMP}"
          mv "${TMP}" "${BODY_FILE}"
          gh pr edit "${EXISTING_NUM}" \
            --title "${TITLE}" \
            --body-file "${BODY_FILE}"
          gh pr edit "${EXISTING_NUM}" --add-label "promotion" 2>/dev/null || true
          echo "::notice::Promotion PR #${EXISTING_NUM} refreshed to ${TAG} — no new PR opened."
          exit 0
        fi

        # No existing PR for this env — open a fresh one.
        BRANCH="${PREFIX}/${NEXT_ENV}/${VERSION}"
        echo "Creating promotion PR: ${BRANCH} → ${TARGET}"

        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -b "${BRANCH}"

        mkdir -p .github/promotions
        printf 'Promote %s to %s.\n' "${TAG}" "${NEXT_ENV}" > ".github/promotions/${VERSION}-to-${NEXT_ENV}.md"

        git add ".github/promotions/${VERSION}-to-${NEXT_ENV}.md"
        git commit -m "${TITLE}"

        REMOTE_URL=$(git remote get-url origin)
        AUTHED_URL=$(echo "${REMOTE_URL}" | sed "s|https://|https://x-access-token:${GH_TOKEN}@|")
        git push "${AUTHED_URL}" "${BRANCH}"

        BODY_FILE=$(mktemp)
        render_body "${BODY_FILE}"

        PR_URL=$(gh pr create \
          --title "${TITLE}" \
          --body-file "${BODY_FILE}" \
          --base "${TARGET}" \
          --head "${BRANCH}") || { echo "::warning::PR already exists for ${BRANCH}"; exit 0; }
        gh pr edit "${PR_URL}" --add-label "promotion" 2>/dev/null || true

    # ═════════════════════════════════════════════════════════════════════════
    # RELEASE MODE — GitHub Projects aggregation (opt-in)
    # ═════════════════════════════════════════════════════════════════════════
    #
    # After a release publishes, walk commits + linked PRs in the release
    # range, collect issue/PR refs (#NNN), look up each ref's Projects v2
    # membership, and append a "## GitHub Project items" section to the
    # release notes (and any open promotion PR body for this tag).
    #
    # Purely additive — never fails the release on its own. Requires a
    # token with org-scoped Projects v2 read; see the input docs.

    - name: Append GitHub Project items to release docs
      if: |
        inputs.mode == 'release' &&
        inputs.aggregate-github-projects == 'true' &&
        steps.normalize.outputs.released == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.auth.outputs.token }}
        OWNER: ${{ github.repository_owner }}
        REPO: ${{ github.event.repository.name }}
        TAG: ${{ steps.normalize.outputs.tag }}
        PRERELEASE_IDENTIFIER: ${{ steps.detect-env.outputs.prerelease_identifier }}
      run: "${GITHUB_ACTION_PATH}/scripts/append-github-projects.sh"

    # ═════════════════════════════════════════════════════════════════════════
    # RELEASE MODE — ClickUp ticket aggregation (opt-in)
    # ═════════════════════════════════════════════════════════════════════════

    - name: Append ClickUp tickets to release docs
      if: |
        inputs.mode == 'release' &&
        inputs.aggregate-clickup-tickets == 'true' &&
        steps.normalize.outputs.released == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.auth.outputs.token }}
        OWNER: ${{ github.repository_owner }}
        REPO: ${{ github.event.repository.name }}
        TAG: ${{ steps.normalize.outputs.tag }}
        PRERELEASE_IDENTIFIER: ${{ steps.detect-env.outputs.prerelease_identifier }}
      run: "${GITHUB_ACTION_PATH}/scripts/append-clickup-tickets.sh"

    # ═════════════════════════════════════════════════════════════════════════
    # RELEASE MODE — GitHub Projects auto-move (opt-in)
    # ═════════════════════════════════════════════════════════════════════════
    #
    # Move every Projects v2 item linked to issues/PRs in the release range
    # to a target Status (e.g. "Released"). Off by default. Restricted to
    # the production environment unless `github-projects-move-on-environments`
    # widens the scope. Requires a token with org-scoped Projects v2 write.

    - name: Resolve Projects move scope
      id: projects-move-scope
      if: |
        inputs.mode == 'release' &&
        inputs.move-github-projects-on-release == 'true' &&
        steps.normalize.outputs.released == 'true'
      shell: bash
      env:
        ENVS: ${{ inputs.environments }}
        SCOPE_RAW: ${{ inputs.github-projects-move-on-environments }}
        CURRENT_ENV: ${{ steps.detect-env.outputs.environment }}
      run: |
        set -euo pipefail
        if [ "${SCOPE_RAW}" = "@last" ] || [ -z "${SCOPE_RAW}" ]; then
          ALLOWED=$(echo "${ENVS}" | jq -c '[.[-1]]')
        elif [ "${SCOPE_RAW}" = "[]" ]; then
          ALLOWED="${ENVS}"
        else
          ALLOWED="${SCOPE_RAW}"
        fi
        if echo "${ALLOWED}" | jq -e --arg e "${CURRENT_ENV}" 'index($e) != null' >/dev/null; then
          echo "should-run=true" >> "$GITHUB_OUTPUT"
          echo "Auto-move enabled for '${CURRENT_ENV}' (allowed: ${ALLOWED})"
        else
          echo "should-run=false" >> "$GITHUB_OUTPUT"
          echo "Auto-move skipped for '${CURRENT_ENV}' (not in ${ALLOWED})"
        fi

    - name: Move GitHub Project items to target status
      if: |
        steps.projects-move-scope.outputs.should-run == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.auth.outputs.token }}
        OWNER: ${{ github.repository_owner }}
        REPO: ${{ github.event.repository.name }}
        TAG: ${{ steps.normalize.outputs.tag }}
        PRERELEASE_IDENTIFIER: ${{ steps.detect-env.outputs.prerelease_identifier }}
        TARGET_STATUS: ${{ inputs.github-projects-target-status }}
      run: "${GITHUB_ACTION_PATH}/scripts/move-github-projects.sh"

    # ═════════════════════════════════════════════════════════════════════════
    # ENABLE-AUTO-MERGE MODE — turn on native GitHub auto-merge for a PR
    # ═════════════════════════════════════════════════════════════════════════
    #
    # Invoked from a separate caller workflow (typically `pull_request`) to
    # opt a non-promotion PR into native auto-merge so it lands as soon as
    # required checks pass and required reviews approve.
    #
    # Repo prerequisites (GitHub-side, not enforced by this action):
    #   - "Allow auto-merge" enabled in Settings → General → Pull Requests
    #   - Branch protection on the target branch with at least one
    #     required status check
    # The helper warns-and-continues if either is missing — the PR is
    # still mergeable manually.

    - name: Enable auto-merge
      if: inputs.mode == 'enable-auto-merge'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.auth.outputs.token }}
        OWNER: ${{ github.repository_owner }}
        REPO: ${{ github.event.repository.name }}
        PR_NUMBER: ${{ inputs.pr-number }}
        MERGE_METHOD: ${{ inputs.auto-merge-method }}
      run: "${GITHUB_ACTION_PATH}/scripts/enable-auto-merge.sh"
