site_name: Diatreme
site_description: >-
  Release and deployment orchestration: a GitHub Marketplace composite action
  plus the hosted GitHub App broker that backs it.
site_url: https://magmamoose.github.io/diatreme/
repo_url: https://github.com/MagmaMoose/diatreme
repo_name: MagmaMoose/diatreme
docs_dir: docs

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.top
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Setup: setup.md
  - Using the action: action.md
  - Architecture: architecture.md
  - Broker: worker.md
  - How-to:
      - Releasing several packages: how-to/release-several-packages.md
  - Reference:
      - Action: reference/action.md
      - Broker API: reference/broker-api.md
      - Broker configuration: reference/configuration.md
      - Errors: reference/errors.md
      - Limits: reference/limits.md
  - Operations:
      - Deployment: operations/deployment.md
  - Security: security.md
  - Glossary: glossary.md
  - Contributing: contributing.md
