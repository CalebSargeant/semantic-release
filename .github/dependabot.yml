# `cooldown` holds a newly published version back for 7 days before Dependabot will
# propose it, so a compromised or yanked release has a window to be caught and pulled
# before it reaches a PR. GitHub already applies 3 days implicitly; 7 is the hardened
# value, and it has to be repeated per `package-ecosystem` — there is no file-level key.
# Version updates only: GitHub exempts security updates, so an advisory fix still opens
# its PR immediately.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  # The Cloudflare Worker's npm dependencies (worker/package.json). Only the
  # runtime dep `jose` ships; the rest (wrangler/vitest/typescript/@types) are
  # dev-only. Grouped so a weekly bump lands as one PR, and CI's `worker` job
  # (typecheck + tests) gates it.
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      worker:
        patterns: ['*']

  # Tracks the pins in scripts/psr-requirements.txt, which
  # scripts/run-python-semantic-release.sh installs: python-semantic-release
  # itself, plus any of its own dependencies the file has to pin to keep psr
  # working (currently gitpython). Nothing else in this repo is a Python
  # dependency.
  #
  # Scoped to /scripts, not /, on purpose: Dependabot fetches manifests relative
  # to `directory`, and the root pyproject.toml is python-semantic-release's own
  # release metadata ([tool.semantic_release] — version, tag_format, changelog
  # settings). It declares no dependencies, so pointing pip at / would hand
  # Dependabot a manifest it has no business updating.
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # CI smoke-tests the pinned CLI (see `Smoke-test the pinned
    # python-semantic-release` in ci.yaml), so a bump that renames or drops a
    # `version` flag — or a gitpython bump psr cannot load a config against —
    # fails the PR rather than a consumer's release run. A major can change psr's
    # behaviour in ways that check cannot see — changelog rendering, commit
    # parsing, tag formats — so majors stay a human decision.
    ignore:
      - dependency-name: python-semantic-release
        update-types: ['version-update:semver-major']
