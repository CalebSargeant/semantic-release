name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate action distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install shell tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck

      - name: Install actionlint
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          echo "${PWD}" >> "$GITHUB_PATH"

      - name: Confirm single root action metadata file
        run: |
          set -euo pipefail
          count="$(find . -maxdepth 1 \( -name action.yml -o -name action.yaml \) -print | wc -l | tr -d ' ')"
          test "${count}" = "1"

      - name: Parse action metadata
        run: |
          ruby -e 'require "yaml"; doc = YAML.load_file("action.yml"); abort "not composite" unless doc.dig("runs", "using") == "composite"; abort "missing name" unless doc["name"]'

      - name: Run actionlint
        run: actionlint -color=false

      - name: ShellCheck runtime scripts
        run: shellcheck -S warning scripts/*.sh

      - name: Run Bats tests
        run: bats tests/bats

  worker:
    name: Validate worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
