name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate action distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install shell tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck

      - name: Install actionlint
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          echo "${PWD}" >> "$GITHUB_PATH"

      - name: Confirm single root action metadata file
        run: |
          set -euo pipefail
          count="$(find . -maxdepth 1 \( -name action.yml -o -name action.yaml \) -print | wc -l | tr -d ' ')"
          test "${count}" = "1"

      - name: Parse action metadata
        run: |
          ruby -e 'require "yaml"; doc = YAML.load_file("action.yml"); abort "not composite" unless doc.dig("runs", "using") == "composite"; abort "missing name" unless doc["name"]'

      - name: Run actionlint
        run: actionlint -color=false

      - name: ShellCheck runtime scripts
        run: shellcheck -S warning scripts/*.sh

      - name: Run Bats tests
        run: bats tests/bats
