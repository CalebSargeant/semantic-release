name: 💡 Feature request
description: Propose a new capability, input/output, or worker endpoint.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, and in what workflow does it hurt?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The new input/output, mode, or worker endpoint you have in mind.
    validations:
      required: true
  - type: textarea
    id: compat
    attributes:
      label: Backward compatibility
      description: Does this change any existing input/output name, default, or behavior? If so, how should it be sequenced?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
